<style>

<body>
<div id="wrap"><canvas id="c" width="720" height="1280"></canvas></div>
<script>
// ─────────────────────────────────────────
// 빙의 파티 로그라이크 시험판 — PD 기획서 v0.1(2026-10-29) + 보완 다섯 가지
// 그림: 게임 유닛 그림(data URI). 수치는 전부 시험값.
// ─────────────────────────────────────────
const SPR=/*SPRITES*/{};
const IMG={};for(const k in SPR){const i=new Image();i.src=SPR[k];IMG[k]=i;}
const cv=document.getElementById('c'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const W=720,H=1280,TOP=150,BOT=1010,PANEL_Y=1010;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ─────────────────────────────────────────
// 표 — 속성 · 조직 · 호스트
// ─────────────────────────────────────────
const ATTR={force:'파워',blade:'무기',magic:'마법'},ATTRCOL={force:'#ff6a4d',blade:'#f2c14e',magic:'#6aa8ff'};
const BEATS={force:'blade',blade:'magic',magic:'force'}; // 이기는 쪽
const ORGCOL={'갱단':'#ff8a6a','코만도 부대':'#a8c46a','무도가':'#f2c14e','괴물':'#73ff8c','마도':'#c9a8ff'};
// 조직 시너지 — 2명 약 · 3명 강
const ORGFX={
 '갱단':{d:['치명타 +10%','치명타 +20%'],crit:[0.1,0.2]},
 '코만도 부대':{d:['받는 피해 −10%','받는 피해 −20%'],def:[0.1,0.2]},
 '무도가':{d:['이동 · 공격 속도 +10%','이동 · 공격 속도 +20%'],spd:[0.1,0.2]},
 '괴물':{d:['피해 +8%','피해 +18%'],dmg:[0.08,0.18]},
 '마도':{d:['스킬 쿨 −15%','스킬 쿨 −30%'],cd:[0.15,0.3]},
};
// atk kind: 단발 single · 연사 rapid · 확산 spread · 수류탄 grenade · 관통 pierce · 근접 melee · 주변 nova
const HOSTS={
 gangster:{n:'갱스터',org:'갱단',at:'blade',hp:300,atk:26,spd:250,kind:'single',act:['일제 표식',6,'방 안 모든 적에 3초 표식(받는 피해 +30%)'],pas:['처형 계약','표식 붙은 적을 맞히면 20% 즉사'],ult:'청부 처형'},
 thug:{n:'폭력배',org:'갱단',at:'blade',hp:320,atk:24,spd:240,kind:'spread',act:['난사',5,'다섯 갈래 × 3번 사격'],pas:['난전','근처 적이 셋 이상이면 공격 +15%'],ult:'회전 난사'},
 amazon:{n:'아마존',org:'무도가',at:'blade',hp:360,atk:30,spd:270,kind:'melee',act:['도약 강타',5,'가까운 적에게 뛰어들어 둘레 300%'],pas:['쉴드 질주','이동 속도 +20%'],ult:'번개 무희'},
 commando_mg:{n:'코만도(기관총)',org:'코만도 부대',at:'blade',hp:380,atk:22,spd:230,kind:'rapid',act:['방벽 전개',8,'5초 쉴드(최대 체력 50%)'],pas:['중장갑','받는 피해 −20%'],ult:'탄막 요새'},
 commando_grenade:{n:'코만도(수류탄)',org:'코만도 부대',at:'force',hp:330,atk:26,spd:235,kind:'grenade',act:['융단 폭격',5,'적 둘레에 폭탄 8발'],pas:['파편탄','탄이 방패를 무시'],ult:'C4'},
 robot:{n:'로봇',org:'코만도 부대',at:'force',hp:400,atk:22,spd:220,kind:'pierce',act:['포탑 전개',10,'10초 자동 포탑'],pas:['예비 회로','평타 2% 로 스킬 쿨 −1초'],ult:'포탑 군단'},
 ninja_chain:{n:'닌자(사슬)',org:'무도가',at:'force',hp:340,atk:27,spd:265,kind:'nova',act:['사슬 결박',6,'모든 적 3초 묶기(받는 피해 +30%)'],pas:['흘리기','10% 피해 회피'],ult:'사슬 돌격'},
 baseball:{n:'슬러거',org:'무도가',at:'force',hp:350,atk:28,spd:245,kind:'nova',act:['전탄 반사',8,'5초간 둘레 적 탄을 되받아침'],pas:['장외 타구','처치 시 20% 둘레 적 날림'],ult:'풀스윙 회오리'},
 salamander:{n:'샐러맨더',org:'괴물',at:'magic',hp:350,atk:24,spd:235,kind:'spread',act:['독 뿜기',5,'둘레 적 중독 · 둔화'],pas:['독니','10% 중독 · 중독 적 받는 피해 +25%'],ult:'독 늪'},
 dragoon:{n:'드라군',org:'괴물',at:'magic',hp:370,atk:27,spd:245,kind:'spread',act:['화염 지대',6,'가까운 적 발밑에 불바다'],pas:['불씨','10% 화상'],ult:'메테오'},
 dragon_blue:{n:'청룡',org:'괴물',at:'magic',hp:330,atk:26,spd:245,kind:'single',act:['뇌전 폭주',6,'2초간 낙뢰 8번'],pas:['낙뢰','10% 로 근처 적에게 번개'],ult:'천뢰'},
 guru:{n:'구루',org:'마도',at:'force',hp:350,atk:23,spd:255,kind:'nova',act:['수호 결계',6,'3초 받는 피해 −50%'],pas:['무형보','장애물을 통과해 걷는다'],ult:'결계 가두기'},
 medium:{n:'영매',org:'마도',at:'magic',hp:300,atk:26,spd:240,kind:'pierce',act:['해골 소환',8,'해골 2기(8초)'],pas:['강령','처치 시 30% 해골'],ult:'골렘 강령'},
 snowwoman:{n:'설녀',org:'마도',at:'magic',hp:310,atk:24,spd:250,kind:'spread',act:['얼음 감옥',6,'1초 무적 + 체력 30% 회복'],pas:['서릿발','30% 빙결 · 빙결 적 받는 피해 +30%'],ult:'얼음 진'},
};
const HOSTKEYS=Object.keys(HOSTS);
// 보완 ④ — 자동으로 쓰면 이상한 액티브(자기 방어 · 자기 회복 · 반사)는 보조 전용 스킬을 따로 둔다
const SUBSK={
 commando_mg:{n:'엄호 사격',d:'가까운 적에게 1.5초 연사'},
 guru:{n:'결계 파동',d:'둘레 적을 밀어내고 1.5초 둔화'},
 snowwoman:{n:'서리 바람',d:'둘레 적 1.2초 빙결'},
 baseball:{n:'라인 드라이브',d:'관통 강타구 + 밀쳐내기'},
};
function subSkillName(k){return SUBSK[k]?SUBSK[k].n:HOSTS[k].act[0];}
function subSkillDesc(k){return SUBSK[k]?SUBSK[k].d:HOSTS[k].act[2];}
// 보완 ③ — 손으로 만드는 합체 스킬은 원작 상징 조합 8개만. 나머지 레시피는 태그로 자동
const COMBOS=[
 {a:'gangster',b:'thug',n:'갱단 일제 사격'},
 {a:'dragoon',b:'salamander',n:'불바다'},
 {a:'dragon_blue',b:'ninja_chain',n:'번개 사슬'},
 {a:'snowwoman',b:'baseball',n:'얼음 장타'},
 {a:'commando_mg',b:'commando_grenade',n:'화력 지원'},
 {a:'guru',b:'medium',n:'강령 결계'},
 {a:'amazon',b:'ninja_chain',n:'쌍날 무희'},
 {a:'robot',b:'commando_mg',n:'기계화 진지'},
];
const ETYPE={
 swarm:{n:'떼',hp:34,spd:150,r:18,dmg:8},
 shield:{n:'방패',hp:150,spd:70,r:26,dmg:14},
 turret:{n:'탄막',hp:110,spd:0,r:24,dmg:10},
 dasher:{n:'날쌘',hp:70,spd:90,r:20,dmg:16},
 brute:{n:'거대',hp:520,spd:55,r:36,dmg:24},
};
// 유령 HP 비용(기획서 4절) — 보완 ①은 회복 두 가지를 더한다
const COST={first:20,sub:10,mainSwap:25,subSwap:15,death:30,deathA:20,deathB:5,deathC:40};
const MAINSWAP_MAX=2,SUBSWAP_MAX=1;
// 스테이지 10개 — 몬스터는 고정 배치, 호스트 자리만 랜덤
const STAGES=[
 {t:'start'},
 {t:'battle',en:{swarm:8,brute:1},slots:1},
 {t:'battle',en:{swarm:6,turret:2},slots:2},
 {t:'battle',en:{shield:3,swarm:5},slots:1},
 {t:'elite',en:{shield:2,swarm:4},slots:1},
 {t:'battle',en:{turret:2,dasher:3},slots:2},
 {t:'battle',en:{brute:2,shield:2},slots:1},
 {t:'battle',en:{dasher:3,swarm:8},slots:2},
 {t:'battle',en:{turret:3,shield:2,brute:1},slots:1},
 {t:'boss'},
];
const STAGEN={start:'시작 — 호스트 고르기',battle:'전투',elite:'중간 보스',boss:'챕터 보스'};

// ─────────────────────────────────────────
// 계정 — 유령 = 스탯, 호스트 = 스킬(장비)
// ─────────────────────────────────────────
const GSTAT=[{id:'atk',n:'유령 공격력',per:'+4%',v:0.04},{id:'crit',n:'유령 치명타',per:'+2%',v:0.02},{id:'def',n:'유령 방어력',per:'받는 피해 −3%',v:0.03}];
let acct=store('avsr_possess_acct')||{gold:0,g:{atk:0,crit:0,def:0},shard:{},runs:0,best:0,fix:{f1:true,f2:true,f5:true}};
function saveAcct(){store('avsr_possess_acct',acct);}
const SLV=[0,3,8,15,25]; // 조각 → 스킬 Lv1~5
function hostLv(k){const s=acct.shard[k]||0;let n=0;for(const v of SLV)if(s>=v)n++;return n;}
function skillMul(k){return 1+0.15*(hostLv(k)-1);}
const fix=id=>!!acct.fix[id];

// ─────────────────────────────────────────
// 판 상태
// ─────────────────────────────────────────
let S=null,scene='lobby',modal=null,toastList=[];
function toast(t,c){toastList.push({t,c:c||'#fff',life:2.6});if(toastList.length>3)toastList.shift();}
function later(sec,fn){S.later.push({t:sec,fn});}
function newRun(){
 S={stage:0,t:0,kills:0,lv:1,xp:0,pendingLv:0,
  ghostHP:100,main:null,subs:[],subCap:2,ghost:{x:W/2,y:BOT-120},revive:null,
  mainSwaps:0,subSwaps:0,mcards:{},subLv:{},subPow:0,ghostAtkRun:0,
  ents:[],shots:[],eshots:[],zones:[],allies:[],fx:[],obst:[],later:[],door:null,cleared:false,
  joy:null,keys:{},stopT:0,atkT:0,invuln:0,shield:0,shieldT:0,guardT:0,reflectT:0,
  E:null,used:{},spent:[],log:[]};
 S.E=synOf([]);toastList=[];enterStage(0);scene='play';
}
function spend(n,why){S.ghostHP-=n;S.spent.push({n,why,st:S.stage+1});fxText((S.main||S.ghost).x,(S.main||S.ghost).y-80,'유령 HP −'+n,'#7fe3ff');}
function gain(n,why){S.ghostHP=Math.min(100,S.ghostHP+n);S.spent.push({n:-n,why,st:S.stage+1});toast('유령 HP +'+n+' · '+why,'#7fe3ff');}
function mc(k){return S.mcards[k]||(S.mcards[k]={atk:0,rate:0,multi:0,cd:0,ult:0,hp:0});}
function mkBody(k,x,y){const h=HOSTS[k];const c=mc(k);const hp=h.hp*Math.pow(1.25,c.hp);return{k,x,y,hp,max:hp,atk:h.atk,actCd:0,ult:0,face:0};}
function mkSub(k,x,y){return{k,x,y,cd:rnd(1.5,3),atkT:0,face:0,flashT:0};}
function partyKeys(){const a=[];if(S.main)a.push(S.main.k);S.subs.forEach(m=>a.push(m.k));return a;}

// ─────────────────────────────────────────
// 시너지 — 태그(속성 · 조직) + 메인별 레시피 + 합체
// 효과는 메인에게 100%, 보조에게 50%
// ─────────────────────────────────────────
function synOf(ks){
 const E={dmg:0,crit:0,def:0,spd:0,cd:0,balance:false,list:[],combos:[]};
 const ac={},oc={};ks.forEach(k=>{const h=HOSTS[k];ac[h.at]=(ac[h.at]||0)+1;oc[h.org]=(oc[h.org]||0)+1;});
 for(const a in ac)if(ac[a]>=2){const s=ac[a]>=3?1:0;E.dmg+=[0.1,0.25][s];E.list.push({n:ATTR[a]+' '+ac[a]+'인',d:ATTR[a]+' 피해 +'+[10,25][s]+'%',c:ATTRCOL[a],key:'a_'+a+ac[a]});}
 for(const o in oc)if(oc[o]>=2){const s=oc[o]>=3?1:0,f=ORGFX[o];for(const st of ['crit','def','spd','dmg','cd'])if(f[st])E[st]+=f[st][s];E.list.push({n:o+' '+oc[o]+'인',d:f.d[s],c:ORGCOL[o],key:'o_'+o+oc[o]});}
 if(ks.length>=3&&Object.keys(ac).length===3){E.balance=true;E.def+=0.1;E.list.push({n:'균형',d:'상성 불리 없음 · 받는 피해 −10%',c:'#e8e8ff',key:'bal'});}
 for(const c of COMBOS)if(ks.includes(c.a)&&ks.includes(c.b)){E.combos.push(c);E.list.push({n:'합체 「'+c.n+'」',d:'메인 스킬 뒤 짝이 100% 로 이어 씀',c:'#ffd56a',key:'c_'+c.n});}
 return E;}
function recipesFor(k){const h=HOSTS[k],r=[];
 r.push({type:'org',val:h.org,n:h.org+' 2인 · 3인'});
 r.push({type:'attr',val:h.at,n:ATTR[h.at]+' 3인'});
 const c=COMBOS.find(c=>c.a===k||c.b===k);if(c)r.push({type:'combo',val:c,n:'합체 「'+c.n+'」',partner:c.a===k?c.b:c.a});
 else r.push({type:'bal',n:'균형 — 파워 · 무기 · 마법 하나씩'});
 return r;}
function recipeState(r,ks){
 if(r.type==='org'){const n=ks.filter(k=>HOSTS[k].org===r.val).length;return{n,need:n>=3?3:2,done:n>=2};}
 if(r.type==='attr'){const n=ks.filter(k=>HOSTS[k].at===r.val).length;return{n,need:3,done:n>=3};}
 if(r.type==='combo'){const ok=ks.includes(r.partner);return{n:ok?1:0,need:1,done:ok};}
 const n=new Set(ks.map(k=>HOSTS[k].at)).size;return{n,need:3,done:n>=3&&ks.length>=3};}
// 이 호스트가 지금 메인의 레시피에 필요한가
function recipeNeed(k){if(!S.main)return false;const ks=partyKeys();if(ks.includes(k))return false;
 return recipesFor(S.main.k).some(r=>{const st=recipeState(r,ks);if(st.done&&r.type!=='org')return false;
  if(r.type==='org')return HOSTS[k].org===r.val&&st.n<3;if(r.type==='attr')return HOSTS[k].at===r.val;if(r.type==='combo')return r.partner===k;return !ks.some(x=>HOSTS[x].at===HOSTS[k].at);});}
function synDiff(before,after){const b=new Set(synOf(before).list.map(s=>s.n)),a=synOf(after).list.map(s=>s.n);
 const add=a.filter(n=>!b.has(n)),rm=[...b].filter(n=>!a.includes(n));
 if(!add.length&&!rm.length)return '시너지 변화 없음';return [...add.map(n=>'+ '+n),...rm.map(n=>'− '+n)].join(' · ');}

// ─────────────────────────────────────────
// 스테이지 만들기
// ─────────────────────────────────────────
function enterStage(i){
 // 두고 온 약해진 호스트 = 놔두기
 S.stage=i;const R=STAGES[i],rng=seeded(i*977+13);
 S.ents=[];S.shots=[];S.eshots=[];S.zones=[];S.allies=[];S.fx=[];S.door=null;S.cleared=false;S.obst=[];
 if(R.t==='battle'||R.t==='elite'){const n=2+(i%3);for(let j=0;j<n;j++){const w=70+rng()*60,h=50+rng()*20,lf=j%2===0;
  for(let tries=0;tries<20;tries++){const o={x:lf?40+rng()*(230-w):450+rng()*(230-w),y:TOP+180+rng()*(BOT-TOP-440),w,h};if(!S.obst.some(b=>o.x<b.x+b.w+40&&o.x+o.w+40>b.x&&o.y<b.y+b.h+40&&o.y+o.h+40>b.y)){S.obst.push(o);break;}}}}
 const p=S.main||S.ghost;p.x=W/2;p.y=BOT-80;S.subs.forEach((m,j)=>{m.x=W/2+(j?-60:60);m.y=BOT-40;});
 const lvl=1+i*0.15;
 if(R.t==='start'){const pool=HOSTKEYS.slice().sort(()=>Math.random()-0.5).slice(0,3);pool.forEach((k,j)=>addHost(k,180+j*180,TOP+330,0.6,{cand:true}));
  toast('유령은 공격하지 못한다 — 후보 하나를 터치하면 바로 메인으로 빙의','#5cc8ff');}
 if(R.en)for(const ty in R.en)for(let j=0;j<R.en[ty]+Math.floor(i/4);j++)addEnemy(ty,80+rng()*(W-160),TOP+60+rng()*360,lvl,rng);
 if(R.slots)for(let j=0;j<R.slots;j++){const k=pickHost();if(k)addHost(k,120+rng()*(W-240),TOP+140+rng()*240,lvl);}
 if(R.t==='elite'){S.ents.push({ty:'elite',x:W/2,y:TOP+200,r:46,hp:2400,max:2400,spd:50,dmg:22,at:'force',t:2,st:3,slow:0});toast('중간 보스 「결사 간부」 — 빙의할 수 없다','#ff9a3c');}
 if(R.t==='boss'){S.ents.push({ty:'boss',x:W/2,y:TOP+200,r:70,hp:5600,max:5600,spd:60,at:'magic',pat:0,patT:3,slow:0});toast('챕터 보스 — 빙의할 수 없다','#ff5c4d');}
}
// 호스트 자리: 파티에 없는 호스트 중 랜덤, 지금 메인 레시피에 필요한 호스트는 확률 소폭 보정(×2.5)
function pickHost(){const pk=partyKeys(),here=S.ents.filter(e=>e.ty==='host').map(e=>e.k);let pool=HOSTKEYS.filter(k=>!pk.includes(k)&&!here.includes(k));if(!pool.length)return null;
 const w=pool.map(k=>recipeNeed(k)?2.5:1),sum=w.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let j=0;j<pool.length;j++){r-=w[j];if(r<=0)return pool[j];}return pool[0];}
function addEnemy(ty,x,y,lvl,rng){const e=ETYPE[ty];const at=['force','blade','magic'][Math.floor((rng?rng():Math.random())*3)];S.ents.push({ty,x,y,r:e.r,hp:e.hp*lvl,max:e.hp*lvl,spd:e.spd,dmg:e.dmg*(0.8+lvl*0.2),at,t:rnd(0.5,2),state:0,face:Math.PI/2,slow:0});}
function addHost(k,x,y,lvl,o){o=o||{};const h=HOSTS[k];S.ents.push({ty:'host',k,x,y,r:26,hp:h.hp*lvl*0.7,max:h.hp*lvl*0.7,spd:h.spd*0.45,dmg:h.atk*0.35*lvl,at:h.at,t:rnd(0.8,2),cand:!!o.cand,weak:false,slow:0,hitT:0});}

// ─────────────────────────────────────────
// 피해
// ─────────────────────────────────────────
function passiveMul(k){return S.main&&S.main.k===k?1:0;} // 패시브는 메인만
function ghostAtk(){return 1+acct.g.atk*0.04+S.ghostAtkRun;}
function hurtEnemy(e,dmg,o){
 o=o||{};if(e.dead||e.cand)return;
 const party=o.src==='party',syn=party?0.5:1,E=S.E||synOf(partyKeys());
 if(e.ty==='shield'&&o.shot&&!o.aoe&&!(o.src==='me'&&passiveMul('commando_grenade'))){const a=Math.atan2(o.from.y-e.y,o.from.x-e.x);const d=Math.abs(((a-e.face)+Math.PI*3)%(Math.PI*2)-Math.PI);if(d<1.0){fxText(e.x,e.y-30,'막힘','#aaa');return;}}
 let m=ghostAtk();
 // 상성 — 보완 ⑤ 를 켜면 보조에게도 적용
 if(o.at&&(!party||fix('f5'))){if(BEATS[o.at]===e.at)m*=1.3;else if(BEATS[e.at]===o.at&&!E.balance)m*=0.7;}
 if(e.mark>0)m*=1.3;if(e.root>0)m*=1.3;if(e.poison>0&&passiveMul('salamander'))m*=1.25;if(e.freeze>0)m*=1.3;
 m*=1+E.dmg*syn;
 if(!party&&S.main)m*=1+0.2*mc(S.main.k).atk;
 if(o.src==='me'&&passiveMul('thug')){let n=0;for(const x of S.ents)if(!x.dead&&dist(x,S.main)<300)n++;if(n>=3)m*=1.15;}
 const crit=Math.random()<0.05+acct.g.crit*0.02+E.crit*syn;if(crit)m*=2;
 dmg*=m;
 if(o.src==='me'){
  if(passiveMul('gangster')&&e.mark>0&&Math.random()<0.2){if(e.ty==='boss'||e.ty==='elite')dmg+=e.max*0.03;else{dmg=e.hp+1;fxText(e.x,e.y-40,'처형','#ff5c4d');}}
  if(passiveMul('salamander')&&Math.random()<0.1)e.poison=3;
  if(passiveMul('dragoon')&&Math.random()<0.1)e.burn=3;
  if(passiveMul('snowwoman')&&Math.random()<0.3&&e.ty!=='boss')e.freeze=1.6;
  if(passiveMul('dragon_blue')&&Math.random()<0.1){const t=nearestEnemy(e,250,e);if(t){hurtEnemy(t,dmg*0.5,{at:'magic'});S.fx.push({ty:'bolt',x:e.x,y:e.y,x2:t.x,y2:t.y,life:0.25});}}
  if(passiveMul('robot')&&Math.random()<0.02&&S.main)S.main.actCd=Math.max(0,S.main.actCd-1);
 }
 if(S.main)S.main.ult=Math.min(1,S.main.ult+dmg/(S.main.atk*120)*(1+0.4*mc(S.main.k).ult));
 e.hp-=dmg;e.hitT=0.1;if(o.src==='me')S.lastHitT=S.t;
 fxText(e.x+rnd(-10,10),e.y-20,Math.round(dmg)+'',crit?'#ffd24d':party?'#cfe8ff':'#fff');
 // 호스트는 체력 35% 아래면 「빙의 가능」 표시만 — 계속 싸우고, 죽기 전에 터치해야 데려온다
 if(e.ty==='host'&&!e.weak&&e.hp>0&&e.hp<=e.max*0.35){e.weak=true;if(possessOK())fxText(e.x,e.y-50,'빙의 가능 — 죽기 전에 터치','#5cc8ff');}
 if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
 if(e.dead)return;e.dead=true;S.kills++;S.xp+=e.ty==='boss'?0:e.ty==='elite'?60:(e.ty==='brute'||e.ty==='host')?16:8;
 S.fx.push({ty:'ring',x:e.x,y:e.y,r:e.r+20,c:'#fff',life:0.3});
 if(passiveMul('medium')&&Math.random()<0.3)S.allies.push({ty:'skel',x:e.x,y:e.y,life:4,t:0});
 if(passiveMul('baseball')&&Math.random()<0.2){for(const x of S.ents)if(!x.dead&&x!==e&&dist(x,e)<150){const a=Math.atan2(x.y-e.y,x.x-e.x);x.x+=Math.cos(a)*80;x.y+=Math.sin(a)*80;hurtEnemy(x,30,{});}}
 if(e.ty==='elite'){toast('결사 간부 처치!','#ff9a3c');if(fix('f1'))gain(15,'중간 보스 처치(보완 ①)');}
 if(e.ty==='boss'){S.won=true;S.winT=1;}
 checkLv();
}
function checkLv(){while(S.xp>=30*S.lv){S.xp-=30*S.lv;S.lv++;S.pendingLv++;}}
function aoe(x,y,r,dmg,o){for(const e of S.ents)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r)hurtEnemy(e,dmg,Object.assign({aoe:true},o));}
function nearestEnemy(p,maxD,not){let b=null,bd=maxD||1e9;for(const e of S.ents){if(e.dead||e===not||e.cand)continue;const d=dist(e,p);if(d<bd){bd=d;b=e;}}return b;}
function fxText(x,y,t,c){S.fx.push({ty:'txt',x,y,t,c,life:0.8});}
function hurtMe(d,from){
 if(!S.main||S.invuln>0)return;const E=S.E;
 let m=1-acct.g.def*0.03;m*=1-E.def;if(passiveMul('commando_mg'))m*=0.8;if(S.guardT>0)m*=0.5;
 if(from&&from.at){if(BEATS[from.at]===HOSTS[S.main.k].at)m*=E.balance?1:1.3;else if(BEATS[HOSTS[S.main.k].at]===from.at)m*=0.7;}
 if(passiveMul('ninja_chain')&&Math.random()<0.1){fxText(S.main.x,S.main.y-40,'흘림','#ccc');return;}
 d*=Math.max(0.2,m);if(S.shield>0){const a=Math.min(S.shield,d);S.shield-=a;d-=a;}
 S.main.hp-=d;S.hurtFlash=0.15;if(S.main.hp<=0)mainDies();
}

// ─────────────────────────────────────────
// 스킬 — caster 위치, p 세기(메인 1 · 보조 0.3), sub=보조가 쓰는가
// ─────────────────────────────────────────
function castSkill(k,caster,p,sub){
 const h=HOSTS[k],atk=HOSTS[k].atk*p,tgt=nearestEnemy(caster,900),dp=Math.max(1,p);
 const nm=sub?subSkillName(k):h.act[0];fxText(caster.x,caster.y-58,nm,sub?'#d9c2ff':'#ffd56a');
 if(sub&&SUBSK[k]){switch(k){
  case 'commando_mg':if(tgt)for(let j=0;j<10;j++)later(j*0.15,()=>{const t=nearestEnemy(caster,900);if(t)shoot(caster,Math.atan2(t.y-caster.y,t.x-caster.x)+rnd(-0.08,0.08),atk*1.2,{src:'party'});});break;
  case 'guru':for(const e of S.ents)if(!e.dead&&dist(e,S.main||caster)<220&&e.ty!=='boss'){const a=Math.atan2(e.y-caster.y,e.x-caster.x);e.x+=Math.cos(a)*90;e.y+=Math.sin(a)*90;e.slow=1.5;hurtEnemy(e,atk*1.5,{aoe:true,at:h.at,src:'party'});}S.fx.push({ty:'ring',x:(S.main||caster).x,y:(S.main||caster).y,r:220,c:'#f2c14e',life:0.45});break;
  case 'snowwoman':for(const e of S.ents)if(!e.dead&&dist(e,caster)<260){if(e.ty!=='boss')e.freeze=1.2;hurtEnemy(e,atk*1.2,{aoe:true,at:h.at,src:'party'});}S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:260,c:'#bfe9ff',life:0.5});break;
  case 'baseball':if(tgt){const a=Math.atan2(tgt.y-caster.y,tgt.x-caster.x);shoot(caster,a,atk*6,{src:'party',pierce:true,big:true,knock:true});}break;
 }return;}
 const src=sub?'party':'me';
 switch(k){
  case 'gangster':for(const e of S.ents)if(!e.dead)e.mark=3*dp;break;
  case 'thug':if(tgt){const a0=Math.atan2(tgt.y-caster.y,tgt.x-caster.x);for(let w=0;w<3;w++)later(w*0.18,()=>{for(let j=-2;j<=2;j++)shoot(caster,a0+j*0.22,atk*0.6,{src});});}break;
  case 'amazon':if(tgt){S.fx.push({ty:'beam',x:caster.x,y:caster.y,x2:tgt.x,y2:tgt.y+30,life:0.25});caster.x=tgt.x;caster.y=tgt.y+tgt.r+20;aoe(caster.x,caster.y,120,atk*3,{at:h.at,src});S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:120,c:'#ff9a3c',life:0.4});}break;
  case 'commando_mg':if(S.main){S.shield=Math.max(S.shield,S.main.max*0.5*p);S.shieldT=5;}break;
  case 'commando_grenade':if(tgt){const tx=tgt.x,ty=tgt.y;for(let j=0;j<8;j++){const a=j/8*Math.PI*2,x=tx+Math.cos(a)*120,y=ty+Math.sin(a)*120;later(j*0.06,()=>{aoe(x,y,75,atk*1.4,{at:h.at,src});S.fx.push({ty:'ring',x,y,r:75,c:'#ffb84d',life:0.35});});}}break;
  case 'salamander':for(const e of S.ents)if(!e.dead&&dist(e,caster)<320){e.poison=4*dp;e.slow=Math.max(e.slow,2);hurtEnemy(e,atk*0.6,{aoe:true,at:h.at,src});}S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:320,c:'#73ff8c',life:0.45});break;
  case 'dragoon':if(tgt)S.zones.push({x:tgt.x,y:tgt.y,r:115,life:4,dps:atk*1.1,c:'rgba(255,120,40,.35)',burn:true,src});break;
  case 'dragon_blue':for(let j=0;j<8;j++)later(j*0.25,()=>{const live=S.ents.filter(e=>!e.dead&&!e.cand);if(!live.length)return;const e=live[Math.floor(Math.random()*live.length)];hurtEnemy(e,atk*1.5,{aoe:true,at:h.at,src});S.fx.push({ty:'bolt',x:e.x,y:TOP,x2:e.x,y2:e.y,life:0.2});});break;
  case 'guru':S.guardT=3*dp;break;
  case 'medium':for(let j=0;j<(sub?1:2);j++)S.allies.push({ty:'skel',x:caster.x+rnd(-40,40),y:caster.y-30,life:8,t:0,dmg:18*dp*(sub?0.5:1)});break;
  case 'ninja_chain':for(const e of S.ents)if(!e.dead&&e.ty!=='boss'){e.root=3;S.fx.push({ty:'beam',x:caster.x,y:caster.y,x2:e.x,y2:e.y,life:0.3,c:'#b98cff'});}break;
  case 'baseball':S.reflectT=5;break;
  case 'snowwoman':if(S.main){S.invuln=Math.max(S.invuln,1);S.main.hp=Math.min(S.main.max,S.main.hp+S.main.max*0.3);}S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:90,c:'#bfe9ff',life:0.5});break;
  case 'robot':S.allies.push({ty:'turret',x:caster.x+30,y:caster.y-40,life:sub?6:10,t:0,atk:atk*0.5});break;
 }
}
function mainCd(){const k=S.main.k;return HOSTS[k].act[1]*(1-S.E.cd)*Math.pow(0.8,mc(k).cd);}
function subCd(k){return 6*(1-S.E.cd*0.5)*(1-0.08*(S.subLv[k]||0));}
function subPower(k){return (0.3+S.subPow)*skillMul(k)*(1+0.25*(S.subLv[k]||0));}
function useSkill(){
 if(!S.main||S.main.actCd>0)return;const k=S.main.k;
 castSkill(k,S.main,skillMul(k),false);S.main.actCd=mainCd();
 // 합체 — 짝이 보조로 있으면 메인 스킬 뒤 짝이 100% 로 이어 쓴다(누가 메인이냐에 따라 순서가 바뀐다)
 for(const c of S.E.combos){const pk=c.a===k?c.b:c.b===k?c.a:null;if(!pk)continue;const m=S.subs.find(s=>s.k===pk);if(!m)continue;
  later(0.45,()=>{if(!S.main)return;castSkill(pk,m,skillMul(pk),true);castSkill(pk,m,0.7*skillMul(pk),false);fxText(S.main.x,S.main.y-100,'합체 「'+c.n+'」','#ffd56a');S.flash=0.2;});}
}
function useUlt(){
 if(!S.main||S.main.ult<1)return;const k=S.main.k,h=HOSTS[k],p=skillMul(k);S.main.ult=0;
 S.flash=0.35;S.cut={n:h.ult,k,life:1.1};
 castSkill(k,S.main,2.5*p,false);aoe(S.main.x,S.main.y,240,h.atk*3*p,{at:h.at,src:'me'});S.fx.push({ty:'ring',x:S.main.x,y:S.main.y,r:240,c:'#ffd56a',life:0.6});
 if(k==='gangster'){let b=null;for(const e of S.ents)if(!e.dead&&!e.cand&&(!b||e.hp>b.hp))b=e;if(b)hurtEnemy(b,h.atk*10*p,{at:h.at,src:'me'});}
}

// ─────────────────────────────────────────
// 빙의 · 흡수 · 교체 — 대상을 직접 터치하면 선택창
// ─────────────────────────────────────────
function tapHost(e){
 if(!e||e.dead||e.ty!=='host')return;
 if(e.cand&&!S.main){const cost=S.revive==='A'?COST.deathA:COST.first;spend(cost,S.revive==='A'?'사망 후 새 빙의':'첫 빙의');becomeMain(e);return;}
 if(e.cand){toast('남은 후보는 적이 됐다 — 약하게 만든 뒤 터치','#889');return;}
 if(e.weak&&S.main){if(possessOK())openChoice(e);return;}
 if(!S.main)return;
 toast('체력을 35% 아래로 깎으면 빙의할 수 있다','#889');
}
// 빙의 선택지 중 하나라도 고를 수 있는가 — 없으면 표시도 선택창도 띄우지 않는다
function possessOK(){if(!S||!S.main)return false;const hp=S.ghostHP;
 if(S.mainSwaps<MAINSWAP_MAX&&hp>COST.mainSwap)return true;
 if(S.subs.length<S.subCap)return hp>COST.sub;
 return S.subSwaps<SUBSWAP_MAX&&hp>COST.subSwap;}
function hostLine(k){const h=HOSTS[k];return ATTR[h.at]+' · '+h.org+' · 스킬 Lv'+hostLv(k);}
function openChoice(e){
 const k=e.k,h=HOSTS[k],ks=partyKeys(),opts=[];
 if(!S.main){const cost=S.revive==='A'?COST.deathA:COST.first;
  opts.push({t:'메인으로 빙의 · 유령 HP −'+cost,sub:'직접 조작 · 스킬 「'+h.act[0]+'」 · 필살기 「'+h.ult+'」 · 패시브 「'+h.pas[0]+'」 · '+synDiff(ks,[k,...ks]),gold:true,disabled:S.ghostHP<=cost,fn:()=>{spend(cost,S.revive==='A'?'사망 후 새 빙의':'첫 빙의');becomeMain(e);}});
  opts.push({t:'놔두기',sub:'다른 후보를 본다',fn:()=>{}});
 }else{
  // 고른 자리와 바로 바꾼다 — 원래 있던 호스트는 놓아준다(내보내기를 따로 고르지 않는다)
  const left=MAINSWAP_MAX-S.mainSwaps,sl=SUBSWAP_MAX-S.subSwaps,oldK=S.main.k,subKs=S.subs.map(s=>s.k);
  const refund=fix('f1')?' · '+'놓아주면 +5':'';
  opts.push({t:'메인과 바꾸기 · 유령 HP −'+COST.mainSwap+'  (이번 챕터 남은 '+left+'회)',sub:'메인 '+HOSTS[oldK].n+' 대신 '+h.n+' 이(가) 메인 · '+HOSTS[oldK].n+' 은(는) 사라진다'+refund+' · '+synDiff(ks,[k,...subKs]),disabled:left<=0||S.ghostHP<=COST.mainSwap,
   fn:()=>{spend(COST.mainSwap,'메인 교체');S.mainSwaps++;const old=S.main;becomeMain(e);expelFx(old);}});
  for(let i=0;i<S.subCap;i++){const cur=S.subs[i];
   if(cur){const after=[oldK,...subKs.map((x,j)=>j===i?k:x)];
    opts.push({t:'보조 '+(i+1)+(i===0?' 과':' 와')+' 바꾸기 · 유령 HP −'+COST.subSwap+'  (이번 챕터 남은 '+sl+'회)',sub:HOSTS[cur.k].n+' 대신 '+h.n+' · 자동 스킬 「'+subSkillName(k)+'」 · '+HOSTS[cur.k].n+' 은(는) 사라진다'+refund+' · '+synDiff(ks,after),disabled:sl<=0||S.ghostHP<=COST.subSwap,
     fn:()=>{spend(COST.subSwap,'보조 '+(i+1)+' 교체');S.subSwaps++;e.dead=true;S.used[k]=(S.used[k]||0)+1;S.subs[i]=mkSub(k,e.x,e.y);expelFx(cur);}});}
   else{opts.push({t:'보조 '+(i+1)+' 에 넣기 · 유령 HP −'+COST.sub,sub:'자동 스킬 「'+subSkillName(k)+'」 6초마다 30% · '+synDiff(ks,[...ks,k]),gold:true,disabled:S.ghostHP<=COST.sub,
     fn:()=>{spend(COST.sub,'보조 흡수');e.dead=true;S.used[k]=(S.used[k]||0)+1;S.subs.push(mkSub(k,e.x,e.y));}});break;}}
  opts.push({t:'놔두기',sub:'그대로 둔다 — 계속 싸우다 죽는다',fn:()=>{}});
 }
 modal={title:h.n+' — 어떻게 할까?',lines:[hostLine(k)+' · 보조 스킬 「'+subSkillName(k)+'」: '+subSkillDesc(k)],opts};
}
function becomeMain(e){const k=e.k;e.dead=true;S.main=mkBody(k,e.x,e.y);S.main.ult=1;S.invuln=1.2;S.revive=null;S.used[k]=(S.used[k]||0)+1;
 S.fx.push({ty:'beam',x:S.ghost.x,y:S.ghost.y,x2:e.x,y2:e.y,life:0.35});toast(HOSTS[k].n+' 에 빙의 — 메인','#5cc8ff');
 // 고르고 나면 남은 후보는 사라진다 — 파티는 스테이지를 지나며 하나씩 모은다
 S.ents.forEach(x=>{if(x.cand){x.dead=true;S.fx.push({ty:'ring',x:x.x,y:x.y,r:50,c:'#7fe3ff',life:0.4});}});
 if(STAGES[S.stage].t==='start'&&!S.startDone){S.startDone=true;for(let j=0;j<6;j++)addEnemy('swarm',rnd(80,W-80),rnd(TOP+60,TOP+200),1);toast('보조는 스테이지를 지나며 하나씩 — 호스트를 「빙의 가능」 일 때 터치','#ffd56a');}}
function expelFx(m){S.fx.push({ty:'ring',x:m.x,y:m.y,r:90,c:'#7fe3ff',life:0.5});toast(HOSTS[m.k].n+' 을(를) 놓아줬다','#7fe3ff');if(fix('f1'))gain(5,'놓아주기 환급(보완 ①)');}
// 상단 보조 초상화 길게 누르기 → 메인으로 바꾸기
function openSwapPortrait(i){
 const m=S.subs[i];if(!m||!S.main)return;const left=MAINSWAP_MAX-S.mainSwaps,ks=partyKeys();
 const after=[m.k,S.main.k,...S.subs.filter(x=>x!==m).map(x=>x.k)];

// ─────────────────────────────────────────
// 입력 — 빙의는 대상을 직접 터치(판정 넉넉하게), 그 외 필드는 끌어서 이동
// ─────────────────────────────────────────
function pt(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
const downs={};
cv.addEventListener('pointerdown',ev=>{const p=pt(ev);cv.setPointerCapture(ev.pointerId);
 const hits=UI.filter(u=>p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h);const u=hits[hits.length-1];
 if(modal){if(u)downs[ev.pointerId]={u};return;}
 if(u){downs[ev.pointerId]={u};if(u.hold)u.timer=setTimeout(()=>{u.held=true;u.hold();},550);return;}
 if(scene==='play'&&p.y>TOP&&p.y<PANEL_Y){
  let best=null,bd=80;for(const e of S.ents){if(e.ty!=='host'||!(e.cand||(e.weak&&possessOK())))continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<bd){bd=d;best=e;}}
  if(best){tapHost(best);return;}
  if(!S.joy)S.joy={id:ev.pointerId,ox:p.x,oy:p.y,dx:0,dy:0};}
});
cv.addEventListener('pointermove',ev=>{if(S&&S.joy&&S.joy.id===ev.pointerId){const p=pt(ev);let dx=(p.x-S.joy.ox)/60,dy=(p.y-S.joy.oy)/60;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}S.joy.dx=dx;S.joy.dy=dy;}});
function up(ev){const d=downs[ev.pointerId];delete downs[ev.pointerId];
 if(d){clearTimeout(d.u.timer);const p=pt(ev);const inside=p.x>=d.u.x&&p.x<=d.u.x+d.u.w&&p.y>=d.u.y&&p.y<=d.u.y+d.u.h;if(!d.u.held&&inside&&d.u.fn)d.u.fn();d.u.held=false;}
 if(S&&S.joy&&S.joy.id===ev.pointerId)S.joy=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(S)S.keys[k]=true;if(!S||scene!=='play'||modal)return;if(k==='j')useSkill();if(k==='k')useUlt();});
addEventListener('keyup',ev=>{if(S)S.keys[ev.key.toLowerCase()]=false;});

// ─────────────────────────────────────────
// 시험 고리 — 자동 조종(점검용)
// ─────────────────────────────────────────
function simMove(){const me=S.main||S.ghost;
 if(!S.main){const c=S.ents.find(e=>e.cand);if(c){const d=dist(c,me);return d>40?[(c.x-me.x)/d,(c.y-me.y)/d]:[0,0];}return[0,0];}
 if(S.cleared)return[(W/2-me.x)/60,-1];
 let ax=0,ay=0;const idle=S.t-(S.lastHitT||0)>2;if(!S.simInv&&!idle)for(const s of S.eshots){const d=dist(s,me);if(d<150){ax+=(me.x-s.x)/d;ay+=(me.y-s.y)/d;}}
 const close=['melee','nova'].includes(HOSTS[S.main.k].kind)||S.simInv||idle;for(const e of S.ents){if(e.cand||close)continue;const d=dist(e,me);if(d<e.r+110){ax+=(me.x-e.x)/d*1.5;ay+=(me.y-e.y)/d*1.5;}}
 if(Math.hypot(ax,ay)>0.6)return[ax,ay];
 const t=nearestEnemy(me,2000);if(t&&(dist(t,me)>520||S.t-(S.lastHitT||0)>2)&&dist(t,me)>130)return[(t.x-me.x)/dist(t,me),(t.y-me.y)/dist(t,me)];
 if(me.y<TOP+260)return[0,1];return[0,0];}
function simPick(){if(!modal)return;const o=modal.opts;let i=o.findIndex(x=>!x.disabled&&x.gold);if(i<0)i=o.findIndex(x=>!x.disabled);if(i<0)i=0;const op=o[i];modal=null;op.fn();}
function simTap(){const w=S.ents.find(e=>e.ty==='host'&&!e.simSkip&&((e.cand&&!S.main)||(e.weak&&possessOK())));if(!w||modal)return;
 if(S.main&&S.subs.length>=S.subCap){w.simSkip=true;return;} // 칸이 차면 놔두기
 tapHost(w);if(modal)simPick();}
window.__T={newRun,step:dt=>update(dt),get S(){return S},get modal(){return modal},pick:i=>{const o=modal.opts[i];modal=null;o.fn();},tapHost,useSkill,useUlt,openSwapPortrait,setFix:(id,v)=>{acct.fix[id]=v;},
 run:(sec,o)=>{o=o||{};S.sim=true;S.simInv=!!o.invuln;const n=Math.round(sec*60);for(let i=0;i<n&&scene==='play';i++){if(o.invuln&&S.main)S.invuln=1;if(modal)simPick();else{simTap();update(1/60);}}return{scene,stage:S.stage+1,hp:Math.round(S.ghostHP),main:S.main&&S.main.k,subs:S.subs.map(s=>s.k),lv:S.lv,res:S.result};}};
