<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소환 징조 시험판</title>
<style>
  :root { --bg:#0d1416; --panel:#162227; --line:#2b3f45; --text:#e6f1f2; --dim:#8fa7ab; --accent:#5ad1ff; --gold:#ffc94d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Noto Sans KR",sans-serif; }
  .wrap { display:flex; gap:16px; padding:12px 16px; align-items:flex-start; flex-wrap:wrap; }
  canvas { height:calc(100vh - 24px); max-height:960px; aspect-ratio:720/1280; image-rendering:pixelated; background:#000; border-radius:6px; cursor:pointer; }
  .side { width:300px; display:flex; flex-direction:column; gap:12px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:14px; margin:0; color:var(--accent); }
  p { margin:0; font-size:12px; color:var(--dim); line-height:1.5; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#22343a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; cursor:pointer; font-family:inherit; }
  button:hover { border-color:var(--accent); }
  button.go { background:#1f4f5e; border-color:var(--accent); font-weight:bold; }
  button.on { background:#3a3220; border-color:var(--gold); color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="720" height="1280"></canvas>
  <div class="side">
    <div class="box">
      <h1>소환 징조 시험판 2</h1>
      <p>등급은 꽝 · 좋음 둘(좋음 = A · 금 · 대박 한데 묶음). 화면을 누르면 건너뛰기.</p>
    </div>
    <div class="box">
      <h2>1회 뽑기</h2>
      <p>유령 입장 + 실루엣 룰렛(기본). 공개 빛 = 천천히 도는 빛살 + 제자리 반짝임.</p>
      <div class="row">
        <button class="go" data-one="0">꽝</button>
        <button class="go" data-one="1">좋음</button>
      </div>
    </div>
    <div class="box">
      <h2>10회 뽑기 — 슬롯 릴</h2>
      <p>왼쪽부터 멈추며 그 자리에서 깨짐. 좋은 칸은 리치 뒤 그 자리에서 공개. 칸 밑에 이름 · 등급 · 조각, 결과는 이 화면에서 끝.</p>
      <div class="row">
        <button class="go" data-ten="2">좋음 2</button>
        <button class="go" data-ten="1">좋음 1</button>
        <button class="go" data-ten="0">전부 꽝</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const W = 720, H = 1280;
const HOSTS = ['amazon','amazon_elite','baseball','commando_grenade','commando_laser','commando_mg','commando_missile','dragon_blue','dragoon','gangster','guru','hopper','hopper_smg','medium','ninja','ninja_chain','robot','salamander','snowwoman','thug','vampire','white_wizard'];
const NAME = { dragon_blue:'블루 드래곤', amazon:'아마존', amazon_elite:'아마존 정예', robot:'로봇', gangster:'갱스터', ninja:'닌자', ninja_chain:'사슬 닌자', thug:'불량배', hopper:'호퍼', hopper_smg:'기관단총 호퍼',
  baseball:'야구 선수', white_wizard:'백마법사', snowwoman:'설녀', vampire:'뱀파이어', guru:'구루', medium:'영매', salamander:'샐러맨더', dragoon:'용기병',
  commando_grenade:'수류탄병', commando_laser:'레이저병', commando_mg:'기관총병', commando_missile:'미사일병' };
const GOLD = '#ffc94d', SKY = '#5ad1ff';

// ── 그림 ──
const IMG = {};
function load(key, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[key] = i; r(); }; i.onerror = () => r(); i.src = src; }); }
const silCache = {};
function sil(key) {
  if (silCache[key]) return silCache[key];
  const s = IMG[key]; const o = document.createElement('canvas'); o.width = s.width; o.height = s.height;
  const x = o.getContext('2d'); x.drawImage(s, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#0a0d21'; x.fillRect(0, 0, o.width, o.height);
  return silCache[key] = o;
}
const tintCache = {};
function tinted(key, col) {   // 유령 잔상 · 몸빛용 단색
  const id = key + col; if (tintCache[id]) return tintCache[id];
  const s = IMG[key]; const o = document.createElement('canvas'); o.width = s.width; o.height = s.height;
  const x = o.getContext('2d'); x.drawImage(s, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, o.width, o.height);
  return tintCache[id] = o;
}

// ── 도구 ──
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a));
const outCubic = u => 1 - Math.pow(1 - u, 3);
const inOut = u => -(Math.cos(Math.PI * u) - 1) / 2;
const outBack = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const rnd = (a, b) => a + Math.random() * (b - a);
function pick(arr, not) { let k; do { k = arr[Math.floor(Math.random() * arr.length)]; } while (k === not && arr.length > 1); return k; }
function glow(x, y, r, col, a) {
  if (a <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = Math.min(1, a); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}

// ── 배양조 자리 ──
function tankGeo(cx, feetY, tankH) {
  const tw = tankH * 444 / 720, figure = tankH * 0.54, cell = figure / (76 / 128);
  return { cx, feetY, tankH, tw, tankTop: feetY - tankH * 0.33 - tankH / 2, cell, figure,
           glassC: { x: cx, y: feetY - tankH * 0.30 }, glassW: tw * 0.58, glassH: tankH * 0.64, chest: { x: cx, y: feetY - figure * 0.62 } };
}
function drawTank(geo, key, a = 1) { const im = IMG[key]; if (!im) return; g.globalAlpha = a; g.drawImage(im, geo.cx - geo.tw / 2, geo.tankTop, geo.tw, geo.tankH); g.globalAlpha = 1; }
function drawBodyAt(geo, im, scaleX, scaleY, dx = 0, a = 1) {
  const s = geo.cell; g.save(); g.globalAlpha = a; g.translate(geo.cx + dx, geo.feetY); g.scale(scaleX, scaleY);
  g.drawImage(im, -s / 2, -s * (1 - 24 / 128), s, s); g.restore();
}

// ── 파티클 (유리 · 물 · 반짝이) ──
const parts = [];
function burst(geo, k) {
  const n = Math.round(46 * k);
  for (let i = 0; i < n; i++) {
    const side = Math.random() < 0.5 ? -1 : 1, kind = Math.random();
    let im = IMG.chip, cols = 3, rows = 1, size = geo.tankH * rnd(0.015, 0.04);
    if (kind < 0.25) { im = IMG.plateSheet; cols = 5; size = geo.tankH * rnd(0.07, 0.17); }
    else if (kind < 0.55) { im = IMG.splash; cols = 3; rows = 2; size = geo.tankH * rnd(0.03, 0.08); }
    if (!im) continue;
    const f = Math.floor(Math.random() * cols * rows), cw = im.width / cols, ch = im.height / rows;
    const a = rnd(10, 80) * Math.PI / 180, sp = geo.tankH * rnd(0.6, 1.8);
    parts.push({ im, sx: (f % cols) * cw, sy: Math.floor(f / cols) * ch, sw: cw, sh: ch,
      x: geo.glassC.x + side * rnd(0.1, 0.5) * geo.glassW, y: geo.glassC.y + rnd(-0.5, 0.5) * geo.glassH,
      vx: side * Math.sin(a) * sp, vy: -Math.cos(a) * sp * rnd(0.4, 1), rot: rnd(0, 6.28), av: rnd(-1, 1),
      size, life: rnd(1.1, 1.7), age: 0, grav: H * 0.8, drag: 1.2 });
  }
}
function sparkle(x, y, col, n, spread) {   // 유령 꼬리 · 공개 반짝
  for (let i = 0; i < n; i++) parts.push({ im: IMG.spark, sx: 0, sy: 0, sw: 64, sh: 64, x: x + rnd(-spread, spread), y: y + rnd(-spread, spread),
    vx: rnd(-20, 20), vy: rnd(-50, -10), rot: 0, av: 0, size: rnd(14, 30), life: rnd(0.5, 0.9), age: 0, grav: 0, drag: 0.5, col });
}
function stepParts(dt) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt;
    if (p.age >= p.life) { parts.splice(i, 1); continue; }
    p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.av * dt;
    const u = p.age / p.life; g.globalAlpha = u < 0.6 ? 1 : 1 - (u - 0.6) / 0.4;
    g.translate(p.x, p.y); g.rotate(p.rot);
    const im = p.col ? tinted('spark', p.col) : p.im;
    g.drawImage(im, p.sx, p.sy, p.sw, p.sh, -p.size / 2, -p.size / 2, p.size, p.size);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  g.restore(); g.globalAlpha = 1;
}

// ── 공개 빛: 빛살은 한 방향으로 천천히 돌고(두 장을 마주 붙여 원), 반짝이 장은 제자리에서 반짝 ──
function revealLight(cx, footY, size, t, a) {
  if (a <= 0) return;
  // 1) 도는 빛살 — 빛 뿌리를 가슴 높이에 두고 0°·180° 두 장으로 둥근 햇살, 초당 9°
  const rot = t * 9 * Math.PI / 180, ry = footY - size * 0.36;
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a * 0.55; g.translate(cx, ry);
  for (const off of [0, Math.PI]) { g.save(); g.rotate(rot + off); g.drawImage(IMG.light1, -size / 2, -size * 0.93, size, size); g.restore(); }
  g.restore();
  // 2) 제자리 반짝 — 6장을 0.3초마다 겹쳐 넘김(움직이지 않는다)
  const f = t / 0.3, i0 = Math.floor(f) % 6, bl = f - Math.floor(f);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const [k, w] of [[i0, 1 - bl], [(i0 + 1) % 6, bl]]) { g.globalAlpha = a * 0.75 * w; g.drawImage(IMG['light' + (k + 1)], cx - size / 2, footY - size * 0.93, size, size); }
  g.restore(); g.globalAlpha = 1;
}

// ── 룰렛: 바뀌는 시각이 점점 느려지다 진짜에서 멈춤 ──
function makeReel(good) {
  const dur = good ? 1.9 : 0.9, times = []; let t = 0, iv = 0.06;
  while (t < dur) { times.push(t); t += iv; iv *= good ? 1.12 : 1.18; }
  return { times, dur: t };
}
function reelKey(reel, real, seed, t) {
  if (t < 0) return seed[0];
  if (t >= reel.dur) return real;
  let i = 0; while (i + 1 < reel.times.length && t >= reel.times[i + 1]) i++;
  return seed[i % seed.length];
}

// ── 유령: 관 → (좋음) 배양조를 한 바퀴 휘감으며 가슴으로 바로 쏙 / (꽝) 그냥 곡선으로 쏙 ──
const PIPE = { x: 72, y: 1110 };
function ghostAt(s, t) {   // {x, y, behind}
  const geo = s.geo, c = geo.chest, u = seg(t, s.fly0, s.fly1);
  if (!s.good) {
    const k = inOut(u), cx = (PIPE.x + c.x) / 2 - 40, cy = Math.min(PIPE.y, c.y) - 200;
    return { x: (1 - k) * (1 - k) * PIPE.x + 2 * (1 - k) * k * cx + k * k * c.x, y: (1 - k) * (1 - k) * PIPE.y + 2 * (1 - k) * k * cy + k * k * c.y, behind: false };
  }
  // 앞 35%: 관에서 배양조 왼쪽으로 / 뒤 65%: 반지름이 줄며 한 바퀴(나선) 돌아 가슴으로 — 끊김 없이 이어진다
  const R0 = geo.tw * 0.62, split = 0.35;
  if (u < split) {
    const k = u / split, e = k * (2 - k);   // 감속 없이 나선으로 이어지게 끝 속도 유지
    const tx = c.x - R0, ty = c.y, cx = PIPE.x + 40, cy = c.y + 60;
    return { x: (1 - e) * (1 - e) * PIPE.x + 2 * (1 - e) * e * cx + e * e * tx, y: (1 - e) * (1 - e) * PIPE.y + 2 * (1 - e) * e * cy + e * e * ty, behind: false };
  }
  const k = (u - split) / (1 - split), a = Math.PI + k * Math.PI * 2, r = R0 * Math.pow(1 - k, 1.1);
  return { x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r * 0.5 - Math.sin(k * Math.PI) * 30, behind: Math.sin(a) < -0.05 && k < 0.92 };
}
function drawGhost(s, t, behindPass) {
  if (t < s.fly0 - 0.25 || t > s.fly1) return;
  const p = ghostAt(s, Math.max(t, s.fly0));
  if (p.behind !== behindPass) return;
  const a = seg(t, s.fly0 - 0.25, s.fly0) * (1 - seg(t, s.fly1 - 0.08, s.fly1));
  const size = 104 * (s.good ? 1 + 0.06 * Math.sin(t * 9) : 1);
  const col = s.good ? GOLD : '#ffffff';
  // 잔상(좋음은 금빛 · 길게)
  const n = s.good ? 6 : 3;
  for (let i = n; i >= 1; i--) {
    const q = ghostAt(s, Math.max(s.fly0, t - i * 0.045));
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a * (s.good ? 0.32 : 0.12) * (n + 1 - i) / n;
    const sz = size * (1 - i * 0.07); g.drawImage(tinted('ghost', s.good ? '#ffd76a' : '#9fdfff'), q.x - sz / 2, q.y - sz / 2, sz, sz); g.restore();
  }
  if (s.good) { glow(p.x, p.y, size * 1.5, '#ffcf5a', a * 0.75); glow(p.x, p.y, size * 0.8, '#ffffff', a * 0.35); }
  else glow(p.x, p.y, size * 0.9, '#bfe9ff', a * 0.18);
  g.globalAlpha = a; g.drawImage(IMG.ghost, p.x - size / 2, p.y - size / 2, size, size); g.globalAlpha = 1;
  if (s.good && Math.random() < 0.7) sparkle(p.x, p.y, Math.random() < 0.5 ? '#ffd76a' : '#ffffff', 1, 18);
}

// ── 1회 ──
function makeOne(good) {
  const key = good ? pick(['dragon_blue', 'amazon', 'robot', 'white_wizard']) : pick(['gangster', 'thug', 'hopper', 'baseball']);
  const geo = tankGeo(360, 877, 640);
  const s = { kind: 'one', good, key, geo, seed: Array.from({ length: 40 }, () => pick(HOSTS, key)), reel: makeReel(good), burst: false };
  s.fly0 = 0.45; s.fly1 = s.fly0 + (good ? 1.5 : 0.85);
  s.roul = s.fly1 + 0.05; s.crack = s.roul + s.reel.dur + 0.25; s.reveal = s.crack + 0.45;
  return s;
}
function drawOne(s, t, dt) {
  const geo = s.geo, revealed = t >= s.reveal;
  g.drawImage(IMG.stage, 0, 0, W, H);
  g.fillStyle = `rgba(0,0,0,${0.32 * (1 - seg(t, s.reveal, s.reveal + 0.6))})`; g.fillRect(0, 0, W, H);
  if (revealed) revealLight(geo.cx, geo.feetY, 760 * (0.85 + 0.15 * seg(t, s.reveal, s.reveal + 0.5)), t - s.reveal, seg(t, s.reveal, s.reveal + 0.5) * (s.good ? 1 : 0.6));
  drawGhost(s, t, true);   // 배양조 뒤로 도는 구간
  const inU = outCubic(seg(t, 0, 0.45));
  drawTank(geo, revealed ? 'tankBroken' : 'tank', revealed ? 1 : inU);
  if (!revealed) {
    const inside = t >= s.fly1;
    const key = reelKey(s.reel, s.key, s.seed, t - s.roul);
    const shake = t >= s.crack ? Math.sin(t * 50) * (s.good ? 5 : 2) * seg(t, s.crack, s.reveal) : 0;
    if (inside) { glow(geo.glassC.x, geo.glassC.y, 230, s.good ? '#ffcf5a' : '#5ad1ff', s.good ? 0.25 : 0.12); drawBodyAt(geo, sil(key), 1, 1, shake); }
    if (t >= s.crack) { const k = Math.min(2, Math.floor(seg(t, s.crack, s.reveal) * 3)); g.drawImage(IMG['crack' + (k + 1)], geo.cx - geo.tw / 2, geo.tankTop, geo.tw, geo.tankH); }
  } else {
    if (!s.burst) { s.burst = true; burst(geo, s.good ? 1 : 0.45); }
    const u = seg(t, s.reveal, s.reveal + 0.3), tr = t - s.reveal;
    const sy = u < 0.3 ? 1 + 0.15 * u / 0.3 : 1 + 0.15 * (1 - outBack((u - 0.3) / 0.7)), grow = 1 + 0.3 * outCubic(u);
    const breathe = tr > 1.1 ? Math.sin((tr - 1.1) * Math.PI * 2 / 1.8) : 0;
    const im = tr >= 0.25 && tr < 1.1 && IMG[s.key + '_pose'] ? IMG[s.key + '_pose'] : IMG[s.key];
    drawBodyAt(geo, im, (2 - sy) * grow * (1 - 0.01 * breathe), sy * grow * (1 + 0.02 * breathe));
  }
  drawGhost(s, t, false);
  if (s.good) { const f = t < s.reveal ? seg(t, s.reveal - 0.15, s.reveal) : 1 - seg(t, s.reveal, s.reveal + 0.25); if (f > 0) { g.fillStyle = `rgba(255,255,255,${0.75 * f})`; g.fillRect(0, 0, W, H); } }
  stepParts(dt);
  if (t >= s.reveal + 0.6) plateOne(s, outBack(seg(t, s.reveal + 0.6, s.reveal + 1.05)));
  if (t >= s.reveal + 1.3) tapHint();
}
function plateOne(s, k) {
  const pw = 600, ph = 166, x = -720 + (360 - pw / 2 + 720) * k, y = 1000;
  if (IMG.plate) g.drawImage(IMG.plate, x, y, pw, ph);
  g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = 'bold 44px "Malgun Gothic"'; g.fillText(NAME[s.key] || s.key, x + 70, y + 100);
  g.fillStyle = s.good ? GOLD : SKY; g.font = 'bold 26px "Malgun Gothic"'; g.fillText(s.good ? '획득!' : '획득', x + 70, y + 46);
}
function tapHint() { g.fillStyle = 'rgba(255,255,255,0.7)'; g.font = '24px "Malgun Gothic"'; g.textAlign = 'center'; g.fillText('화면을 눌러 계속', 360, 1240); }

// ── 10회: 슬롯 릴 — 왼쪽부터 멈추며 그 자리에서 깨짐, 좋은 칸은 리치 뒤 그 자리 공개, 이 화면에서 끝 ──
function makeTen(goodN) {
  const keys = Array.from({ length: 10 }, () => pick(HOSTS));
  const good = new Array(10).fill(false);
  const goodIdx = goodN === 2 ? [2, 7] : goodN === 1 ? [6] : [];
  goodIdx.forEach(i => good[i] = true);
  const slots = keys.map((k, i) => {
    const c = i % 5, row = Math.floor(i / 5);
    return { key: k, good: good[i], geo: tankGeo(360 + (-2 + c) * 136, 520 + row * 360, 256), seed: Array.from({ length: 40 }, () => pick(HOSTS, k)),
             shards: good[i] ? (Math.random() < 0.5 ? 20 : 5) : (Math.random() < 0.7 ? 2 : 5), isNew: Math.random() < 0.3, burst: false };
  });
  let t = 0.9;
  slots.forEach(sl => { if (sl.good) { sl.reach = t; t += 1.8; sl.stop = t; t += 0.35; } else { sl.stop = t; t += 0.26; } });
  return { kind: 'ten', slots, end: t + 0.5 };
}
function drawTen(s, t, dt) {
  g.drawImage(IMG.stage, 0, 0, W, H);
  g.fillStyle = 'rgba(0,0,0,0.38)'; g.fillRect(0, 0, W, H);
  for (const sl of s.slots) {
    const geo = sl.geo, broke = t >= sl.stop;
    if (broke && sl.good) revealLight(geo.cx, geo.feetY, 300, t - sl.stop, seg(t, sl.stop, sl.stop + 0.4));
  }
  for (const sl of s.slots) {
    const geo = sl.geo, broke = t >= sl.stop, inU = outCubic(seg(t, 0.05, 0.4));
    if (broke && !sl.burst) { sl.burst = true; burst(geo, sl.good ? 0.5 : 0.12); }
    drawTank(geo, broke ? 'tankBroken' : 'tank', broke ? 1 : inU);
    if (!broke) {
      const reaching = sl.reach !== undefined && t >= sl.reach;
      const iv = reaching ? 0.06 + 0.3 * seg(t, sl.reach, sl.stop) : 0.07;   // 리치 때 릴이 점점 느려진다
      if (reaching) { sl.rt = (sl.rt || 0) + dt / iv; } else sl.rt = (t - 0.4) / iv;
      const key = t >= 0.4 ? sl.seed[Math.floor(Math.max(0, sl.rt)) % sl.seed.length] : null;
      const shake = reaching ? Math.sin(t * 40) * 3 * seg(t, sl.reach, sl.stop) : 0;
      if (reaching) glow(geo.glassC.x, geo.glassC.y, 170, '#ffcf5a', 0.45 + 0.3 * seg(t, sl.reach, sl.stop) + 0.15 * Math.sin(t * 8));
      if (key) drawBodyAt(geo, sil(key), 1, 1, shake, inU);
      if (reaching) { g.font = 'bold 32px "Malgun Gothic"'; g.textAlign = 'center'; g.fillStyle = GOLD; g.fillText('리치!', geo.cx, geo.tankTop + 34); }   // 배양조 안쪽 위 — 위 줄 이름표와 겹치지 않게
    } else {
      const tr = t - sl.stop, u = seg(tr, 0, 0.3);
      const sy = u < 0.3 ? 1 + 0.15 * u / 0.3 : 1 + 0.15 * (1 - outBack((u - 0.3) / 0.7)), grow = 1 + (sl.good ? 0.15 : 0.05) * outCubic(u);
      const im = sl.good && tr >= 0.25 && tr < 1.1 && IMG[sl.key + '_pose'] ? IMG[sl.key + '_pose'] : IMG[sl.key];
      drawBodyAt(geo, im, (2 - sy) * grow, sy * grow);
      label(sl, outBack(seg(tr, 0.15, 0.45)));
    }
  }
  stepParts(dt);
  if (t >= s.end) footer(outCubic(seg(t, s.end, s.end + 0.4)));
}
function label(sl, k) {   // 칸 밑 UI — 이름 · 조각 수 · 새 몸
  if (k <= 0) return;
  const geo = sl.geo, w = 128, h = 52, x = geo.cx - w / 2, y = geo.feetY + 52;
  g.save(); g.translate(geo.cx, y + h / 2); g.scale(k, k); g.translate(-geo.cx, -(y + h / 2));
  const plate = sl.good ? IMG.pullPlate10 : IMG.summary;
  if (plate) g.drawImage(plate, x, y, w, h);
  g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = 'bold 15px "Malgun Gothic"';
  g.fillText(NAME[sl.key] || sl.key, geo.cx, y + 22);
  g.fillStyle = sl.good ? GOLD : SKY; g.font = 'bold 15px "Malgun Gothic"'; g.fillText('조각 ×' + sl.shards, geo.cx, y + 42);
  if (sl.isNew && IMG.stampNew) g.drawImage(IMG.stampNew, x + w - 40, y - 18, 50, 33);
  g.restore();
}
function footer(k) {   // 결과는 이 화면에서 끝 — 확인 · 10회 더
  const y = 1120 + (1 - k) * 80;
  g.globalAlpha = k;
  for (const [x, txt] of [[170, '확인'], [550, '10회 더']]) {
    if (IMG.pullPlate) g.drawImage(IMG.pullPlate, x - 120, y - 40, 240, 92);
    g.fillStyle = '#fff'; g.font = 'bold 32px "Malgun Gothic"'; g.textAlign = 'center'; g.fillText(txt, x, y + 20);
  }
  g.globalAlpha = 1;
}

// ── 진행 ──
let scene = null, t0 = 0, last = 0, tapped = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (scene) {
    let t = (now - t0) / 1000;
    if (tapped) {
      tapped = false;
      if (scene.kind === 'one' && t < scene.reveal) { t0 = now - scene.reveal * 1000; t = scene.reveal; }
      if (scene.kind === 'ten' && t < scene.end) { t0 = now - scene.end * 1000; t = scene.end; parts.length = 0; }
    }
    if (scene.kind === 'one') drawOne(scene, t, dt); else drawTen(scene, t, dt);
  }
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', () => tapped = true);
document.querySelectorAll('[data-one]').forEach(b => b.onclick = () => { parts.length = 0; scene = makeOne(b.dataset.one === '1'); t0 = performance.now(); });
document.querySelectorAll('[data-ten]').forEach(b => b.onclick = () => { parts.length = 0; scene = makeTen(+b.dataset.ten); t0 = performance.now(); });

const list = [['stage', 'img/lab_stage.png'], ['tank', 'img/lab_tank.png'], ['tankBroken', 'img/lab_tank_broken.png'], ['ghost', 'img/unitL_ghost_se.png'],
  ['plate', 'img/reveal_plate.png'], ['plateSheet', 'img/lab_shards_plate_sheet.png'], ['chip', 'img/lab_shards_chip_sheet.png'], ['splash', 'img/lab_splash_sheet.png'],
  ['spark', 'img/lab_spark.png'], ['stampNew', 'img/stamp_new.png'], ['summary', 'img/summary_plate.png'], ['pullPlate10', 'img/pull_plate_10.png'], ['pullPlate', 'img/pull_plate.png']];
for (let i = 1; i <= 3; i++) list.push(['crack' + i, `img/lab_crack_0${i}.png`]);
for (let i = 1; i <= 6; i++) list.push(['light' + i, `img/lab_reveal_light_0${i}.png`]);
for (const h of HOSTS) { list.push([h, `img/host/${h}.png`]); list.push([h + '_pose', `img/host/${h}_pose.png`]); }
Promise.all(list.map(([k, s]) => load(k, s))).then(() => {
  g.drawImage(IMG.stage, 0, 0, W, H);
  requestAnimationFrame(frame);
});
</script>
