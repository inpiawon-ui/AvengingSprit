<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>잔혼 파티 시험판</title>
<style>
html,body{margin:0;height:100%;background:#0c0c12;overflow:hidden;touch-action:none;font-family:"Pretendard","Malgun Gothic",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#111;image-rendering:pixelated;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="720" height="1280"></canvas></div>
<script>
// ─────────────────────────────────────────
// 잔혼 파티 시험판 — 게임 방향 1번 안(2026-10-28) 규칙을 직접 해 보는 판
// 그림: 게임 유닛 그림(data URI). 수치는 시험값.
// ─────────────────────────────────────────
const SPR=/*SPRITES*/{};
const IMG={};for(const k in SPR){const i=new Image();i.src=SPR[k];IMG[k]=i;}
const cv=document.getElementById('c'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
const W=720,H=1280,TOP=150,BOT=1010; // 방 영역 y TOP~BOT
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}

// ─────────────────────────────────────────
// 표 — 갈래 · 자리 · 호스트
// ─────────────────────────────────────────
const BR={single:'단일 강타',summon:'소환',rush:'돌격 난무',control:'제압',trap:'설치 · 함정',barrage:'탄막 · 포격',guard:'수호 · 반격'};
const BRCOL={single:'#ff5c4d',summon:'#b98cff',rush:'#ff9a3c',control:'#f2c14e',trap:'#73ff8c',barrage:'#5cc8ff',guard:'#c8c8d8'};
const FIT={guard:'soul',control:'soul',summon:'hand',trap:'hand',single:'spirit',barrage:'spirit',rush:'spirit'};
const SLOTN={soul:'혼 자리 · 패시브',hand:'손 자리 · 액티브',spirit:'혼백 자리 · 필살기'};
const ATTR={force:'파워',blade:'무기',magic:'마법'},ATTRCOL={force:'#ff6a4d',blade:'#f2c14e',magic:'#6aa8ff'};
const BEATS={force:'blade',blade:'magic',magic:'force'}; // 이기는 쪽
// atk: kind 단발 single · 연사 rapid · 확산 spread · 관통 pierce · 근접 melee · 주변 nova
const HOSTS={
 gangster:{n:'갱스터',br:'single',at:'blade',hp:300,atk:26,spd:250,kind:'single',act:['일제 표식',6,'방 안 모든 적에 3초 표식(받는 피해 +30%)'],pas:['처형 계약','표식 붙은 적을 맞히면 20% 즉사(보스는 큰 피해)'],ult:'청부 처형'},
 thug:{n:'폭력배',br:'barrage',at:'blade',hp:320,atk:24,spd:240,kind:'spread',act:['난사',5,'다섯 갈래 × 3번 사격'],pas:['난전','근처 적이 셋 이상이면 공격 +15%'],ult:'회전 난사'},
 amazon:{n:'아마존',br:'rush',at:'blade',hp:360,atk:30,spd:270,kind:'melee',act:['도약 강타',5,'가까운 적에게 뛰어들어 둘레 300%'],pas:['쉴드 질주','이동 속도 +20%'],ult:'번개 무희'},
 commando_mg:{n:'코만도(기관총)',br:'guard',at:'blade',hp:380,atk:22,spd:230,kind:'rapid',act:['방벽 전개',8,'5초 쉴드(최대 체력 50%)'],pas:['중장갑','받는 피해 −20%'],ult:'탄막 요새'},
 commando_grenade:{n:'코만도(수류탄)',br:'trap',at:'force',hp:330,atk:26,spd:235,kind:'grenade',act:['융단 폭격',5,'적 둘레에 폭탄 8발'],pas:['파편탄','탄이 방패를 무시'],ult:'C4'},
 salamander:{n:'샐러맨더',br:'trap',at:'magic',hp:350,atk:24,spd:235,kind:'spread',act:['독 뿜기',5,'둘레 적 중독 · 둔화'],pas:['독니','10% 중독 · 중독 적 받는 피해 +25%'],ult:'독 늪'},
 dragoon:{n:'드라군',br:'rush',at:'magic',hp:370,atk:27,spd:245,kind:'spread',act:['화염 지대',6,'가까운 적 발밑에 불바다'],pas:['불씨','10% 화상'],ult:'메테오'},
 dragon_blue:{n:'청룡',br:'barrage',at:'magic',hp:330,atk:26,spd:245,kind:'single',act:['뇌전 폭주',6,'2초간 낙뢰 8번'],pas:['낙뢰','10% 로 근처 적에게 번개'],ult:'천뢰'},
 guru:{n:'구루',br:'control',at:'force',hp:350,atk:23,spd:255,kind:'nova',act:['수호 결계',6,'3초 받는 피해 −50%'],pas:['무형보','장애물을 통과해 걷는다'],ult:'결계 가두기'},
 medium:{n:'영매',br:'summon',at:'magic',hp:300,atk:26,spd:240,kind:'pierce',act:['해골 소환',8,'해골 2기(8초)'],pas:['강령','처치 시 30% 해골'],ult:'골렘 강령'},
 ninja_chain:{n:'닌자(사슬)',br:'single',at:'force',hp:340,atk:27,spd:265,kind:'nova',act:['사슬 결박',6,'모든 적 3초 묶기(받는 피해 +30%)'],pas:['흘리기','10% 피해 회피'],ult:'사슬 돌격'},
 baseball:{n:'슬러거',br:'control',at:'force',hp:350,atk:28,spd:245,kind:'nova',act:['전탄 반사',8,'5초간 둘레 적 탄을 되받아침'],pas:['장외 타구','처치 시 20% 둘레 적 날림'],ult:'풀스윙 회오리'},
 snowwoman:{n:'설녀',br:'trap',at:'magic',hp:310,atk:24,spd:250,kind:'spread',act:['얼음 감옥',6,'1초 무적 + 체력 30% 회복'],pas:['서릿발','30% 빙결 · 빙결 적 받는 피해 +30%'],ult:'얼음 진'},
 robot:{n:'로봇',br:'summon',at:'force',hp:400,atk:22,spd:220,kind:'pierce',act:['포탑 전개',10,'10초 자동 포탑'],pas:['예비 회로','평타 2% 로 액티브 쿨 −1초'],ult:'포탑 군단'},
};
const HOSTKEYS=Object.keys(HOSTS);
// 적 유형 — 보이는 가위바위보
const ETYPE={
 swarm:{n:'떼',hp:34,spd:150,r:18,dmg:8,spr:'bat',counter:'제압 · 탄막'},
 shield:{n:'방패',hp:150,spd:70,r:26,dmg:14,spr:'armadillo',counter:'돌격 · 설치(폭발)'},
 turret:{n:'탄막',hp:110,spd:0,r:24,dmg:10,spr:'watcher_eye',counter:'수호 · 반격'},
 dasher:{n:'날쌘',hp:70,spd:90,r:20,dmg:16,spr:'boar',counter:'설치 · 소환'},
 brute:{n:'거대',hp:520,spd:55,r:36,dmg:24,spr:'golem',counter:'단일 강타'},
};

// ─────────────────────────────────────────
// 계정(로비) — 박사의 연구 · 호스트 기록
// ─────────────────────────────────────────
const RESEARCH=[
 {id:'hand2',n:'공명 · 손 자리 2칸',cost:5,d:'손 자리를 2칸으로'},
 {id:'share',n:'에너지 · 잔혼 몫 −5%',cost:4,d:'자리마다 나눠 쓰는 몫이 5% 줄어든다'},
 {id:'orb',n:'빙의 · 구슬 빨리',cost:4,d:'혼 이동 구슬 충전 6초 → 4.5초'},
 {id:'iframe',n:'빙의 · 옮겨 타기 무적',cost:3,d:'옮겨 탈 때 1초 무적'},
 {id:'energy',n:'에너지 · 최대치 +20',cost:3,d:'유령 에너지 최대 100 → 120'},
];
let acct=store('avsr_party_acct')||{core:3,res:{},shard:{},runs:0,best:0,companion:null};
function saveAcct(){store('avsr_party_acct',acct);}
function stars(k){const s=acct.shard[k]||0;const t=[4,8,14,20,30];let n=0;for(const v of t)if(s>=v)n++;return n;}
const hasRes=id=>!!acct.res[id];

// ─────────────────────────────────────────
// 판 상태
// ─────────────────────────────────────────
let S=null; // 판
let scene='lobby'; // lobby · play · result
let modal=null; // {title,lines,opts:[{t,sub,fn,gold}]}
let toastList=[];
function toast(t,c){toastList.push({t,c:c||'#fff',life:2.4});if(toastList.length>3)toastList.shift();}

const ROOMS=[ // 15방 짧은 챕터
 {t:'start'},{t:'battle',ty:['swarm','brute']},{t:'battle',ty:['swarm','turret']},{t:'battle',ty:['shield','swarm']},
 {t:'doctor'},{t:'battle',ty:['turret','dasher']},{t:'battle',ty:['brute','shield']},{t:'battle',ty:['dasher','swarm']},
 {t:'battle',ty:['turret','shield']},{t:'leader'},{t:'battle',ty:['swarm','turret','brute']},{t:'battle',ty:['dasher','shield']},
 {t:'battle',ty:['brute','turret']},{t:'battle',ty:['swarm','dasher','shield']},{t:'boss'}];

function newRun(){
 S={room:0,t:0,kills:0,lv:1,xp:0,pendingLv:0,
  maxBase:100+(hasRes('energy')?20:0),energy:0,lost:0,
  body:null,ghost:{x:W/2,y:900},
  soul:null,hand:[],spirit:null,handCap:hasRes('hand2')?2:1,
  orbs:3,orbMax:3,orbT:0,orbRate:hasRes('orb')?4.5:6,swapCd:0,
  ents:[],shots:[],eshots:[],zones:[],allies:[],fx:[],obst:[],
  door:null,cleared:false,rescueT:0,cards:{},fitBonus:0.5,possessed:{},
  joy:null,keys:{},stopT:0,atkT:0,invuln:0,shield:0,shieldT:0,guardT:0,reflectT:0,
  ultReady:false,actCd:0,lastPossess:null};
 S.energy=S.maxBase;
 enterRoom(0);
 // 동행(★3 호스트) — 판 시작에 손 자리에
 if(acct.companion&&stars(acct.companion)>=3){S.hand.push(mkMember(acct.companion,W/2+60,950));toast('동행: '+HOSTS[acct.companion].n+' 이(가) 손 자리에','#b98cff');}
 scene='play';
}
function share(slot){const base={soul:10,hand:15,spirit:20}[slot];return base-(hasRes('share')?5:0);}
function energyMax(){let m=S.maxBase-S.lost;if(S.soul)m-=share('soul');m-=S.hand.length*share('hand');if(S.spirit)m-=share('spirit');return m;}
function hostScale(k){return 1+0.07*stars(k);}
function mkBody(k,x,y,elite){const h=HOSTS[k],sc=hostScale(k)*(elite?1.5:1);return{k,x,y,hp:h.hp*sc,max:h.hp*sc,atk:h.atk*sc,elite:!!elite,actCd:0,face:0};}
function mkMember(k,x,y,src){const b=src||mkBody(k,x,y);b.x=x;b.y=y;b.actCd=b.actCd||rnd(1,3);b.atkT=0;return b;}

// ─────────────────────────────────────────
// 방 만들기
// ─────────────────────────────────────────
function enterRoom(i){
 S.room=i;const R=ROOMS[i];
 S.ents=[];S.shots=[];S.eshots=[];S.zones=[];S.allies=[];S.fx=[];S.door=null;S.cleared=false;S.rescueT=0;
 S.obst=[];
 if(R.t==='battle'||R.t==='leader'){const n=2+((i*7)%3);for(let j=0;j<n;j++){const w=rnd(70,140),h=rnd(50,70);S.obst.push({x:rnd(60,W-60-w),y:rnd(TOP+180,BOT-260),w,h});}}
 const p=S.body||S.ghost;p.x=W/2;p.y=BOT-80;
 S.hand.forEach((m,j)=>{m.x=W/2+(j?-70:70);m.y=BOT-60;});
 // 바뀐 방: 손 자리 몸은 필살기를 이 방에서 다시 한 번 채울 수 있다
 S.ultRoomUsed={};
 const lvl=1+i*0.12;
 if(R.t==='start'){addHost('gangster',W/2,BOT-400,lvl*0.6);toast('유령으로 출전 — 앞의 갱스터에게 다가가 「빙의」','#5cc8ff');}
 if(R.t==='battle'){
  const tys=R.ty;let cnt=0;
  tys.forEach(ty=>{const n={swarm:6,shield:2,turret:2,dasher:3,brute:1}[ty]+Math.floor(i/5);for(let j=0;j<n;j++){addEnemy(ty,rnd(80,W-80),rnd(TOP+60,TOP+420),lvl);cnt++;}});
  const hn=i<9?2:1;const pool=HOSTKEYS.filter(k=>k!==(S.body&&S.body.k));
  for(let j=0;j<hn;j++)addHost(pool[(i*5+j*3)%pool.length],rnd(120,W-120),rnd(TOP+120,TOP+380),lvl);
 }
 if(R.t==='leader'){addHost(['robot','dragoon','commando_mg'][Math.floor(Math.random()*3)],W/2,TOP+200,lvl,true);for(let j=0;j<2;j++)addHost(HOSTKEYS[(j*4+3)%HOSTKEYS.length],150+j*420,TOP+330,lvl);for(let j=0;j<5;j++)addEnemy('swarm',rnd(80,W-80),rnd(TOP+60,TOP+300),lvl);toast('결사 간부 — 경직시켜 빼앗으면 간부 몸(×1.5)','#ff9a3c');}
 if(R.t==='boss'){S.ents.push({ty:'boss',x:W/2,y:TOP+200,r:70,hp:5200,max:5200,spd:60,at:'force',pat:0,patT:3,spr:'robot_snakes',slow:0});toast('아지트 두목 — 빙의할 수 없다 · 패턴마다 옮겨 타기','#ff5c4d');}
 if(R.t==='doctor'){S.cleared=true;openDoctor();}
}
function addEnemy(ty,x,y,lvl){const e=ETYPE[ty];const at=['force','blade','magic'][Math.floor(Math.random()*3)];S.ents.push({ty,x,y,r:e.r,hp:e.hp*lvl,max:e.hp*lvl,spd:e.spd,dmg:e.dmg*(0.8+lvl*0.2),at,t:rnd(0,2),state:0,face:Math.PI/2,slow:0});}
function addHost(k,x,y,lvl,elite){const h=HOSTS[k];const m=elite?1.6:1;S.ents.push({ty:'host',k,x,y,r:elite?34:24,hp:h.hp*lvl*m*0.7,max:h.hp*lvl*m*0.7,spd:h.spd*0.45,dmg:h.atk*0.35*lvl*m,at:h.at,t:rnd(0.5,2),stag:0,stagT:0,stagLock:0,hitT:0,elite:!!elite,slow:0});}

// ─────────────────────────────────────────
// 피해 · 효과
// ─────────────────────────────────────────
function partyKeys(){const a=[];if(S.body)a.push(S.body.k);if(S.soul)a.push(S.soul.k);S.hand.forEach(m=>a.push(m.k));if(S.spirit)a.push(S.spirit.k);return a;}
function passiveMul(k){let m=0;if(S.body&&S.body.k===k)m+=1;if(S.soul&&S.soul.k===k)m+=FIT[HOSTS[k].br]==='soul'?1+S.fitBonus:1;return m;}
function synergies(){const ks=partyKeys(),out=[];const brc={};ks.forEach(k=>{const b=HOSTS[k].br;brc[b]=(brc[b]||0)+1;});
 for(const b in brc)if(brc[b]>=2)out.push({id:'res_'+b,n:'공명 · '+BR[b],d:'같은 갈래 둘 — 내가 쓴 액티브를 40% 로 한 번 더'});
 const has=k=>ks.includes(k);const any=b=>ks.some(k=>HOSTS[k].br===b);
 if(has('snowwoman')&&any('single'))out.push({id:'shatter',n:'얼려 깨기',d:'빙결된 적 받는 피해 +30% 더'});
 if(has('dragoon')&&has('salamander'))out.push({id:'inferno',n:'불바다',d:'화상 · 중독이 같이 붙은 적이 터진다'});
 if(has('dragon_blue')&&has('ninja_chain'))out.push({id:'chainlight',n:'번개 사슬',d:'묶인 적에게 1초마다 번개'});
 if(ks.filter(k=>HOSTS[k].br==='guard'||HOSTS[k].br==='control').length>=2)out.push({id:'wall',n:'철벽',d:'받는 피해 −15%'});
 const ats=new Set(ks.map(k=>HOSTS[k].at));if(ats.size===3)out.push({id:'tri',n:'삼각 진형',d:'모든 피해 +10%'});
 return out;}
let SYN=[];const syn=id=>SYN.some(s=>s.id===id);

function hurtEnemy(e,dmg,o){
 o=o||{};if(e.dead)return;
 // 방패: 정면(플레이어 쪽) 탄은 막는다 — 폭발 · 광역 · 파편탄은 통과
 if(e.ty==='shield'&&o.shot&&!o.aoe&&!(o.src==='me'&&passiveMul('commando_grenade'))){const a=Math.atan2(o.from.y-e.y,o.from.x-e.x);const d=Math.abs(((a-e.face)+Math.PI*3)%(Math.PI*2)-Math.PI);if(d<1.0){fxText(e.x,e.y-30,'막힘','#aaa');return;}}
 let m=1;
 if(o.at){if(BEATS[o.at]===e.at)m*=1.3;else if(BEATS[e.at]===o.at)m*=0.7;}
 if(e.mark>0)m*=1.3;if(e.root>0)m*=1.3;
 if(e.poison>0&&passiveMul('salamander'))m*=1.25;
 if(e.freeze>0){m*=1.3;if(syn('shatter'))m*=1.3;}
 if(syn('tri'))m*=1.1;
 if(o.src==='me'&&passiveMul('thug')){let n=0;for(const x of S.ents)if(!x.dead&&dist(x,S.body)<300)n++;if(n>=3)m*=1.15;}
 let crit=Math.random()<0.08;if(crit)m*=2;
 dmg*=m;
 if(o.src==='me'){ // 몸 · 혼 자리 패시브
  const g=passiveMul('gangster');if(g&&e.mark>0&&Math.random()<0.2*g){if(e.ty==='boss')dmg+=e.max*0.04;else{dmg=e.hp+1;fxText(e.x,e.y-40,'처형','#ff5c4d');}}
  const sa=passiveMul('salamander');if(sa&&Math.random()<0.1*sa)e.poison=3;
  const dr=passiveMul('dragoon');if(dr&&Math.random()<0.1*dr)e.burn=3;
  const sn=passiveMul('snowwoman');if(sn&&Math.random()<0.3*sn&&e.ty!=='boss')e.freeze=1.6;
  const db=passiveMul('dragon_blue');if(db&&Math.random()<0.1*db){const t=nearestEnemy(e,250,e);if(t){hurtEnemy(t,dmg*0.5,{at:'magic'});S.fx.push({ty:'bolt',x:e.x,y:e.y,x2:t.x,y2:t.y,life:0.25});}}
  const rb=passiveMul('robot');if(rb&&Math.random()<0.02*rb&&S.body)S.body.actCd=Math.max(0,S.body.actCd-1);
 }
 if(syn('inferno')&&e.burn>0&&e.poison>0&&!e.boomed){e.boomed=true;aoe(e.x,e.y,110,60,{});S.fx.push({ty:'ring',x:e.x,y:e.y,r:110,c:'#9f6',life:0.4});}
 e.hp-=dmg;e.hitT=0.1;
 if(e.ty==='host'&&e.stagLock<=0&&e.stagT<=0){e.stag+=dmg;e.stagHit=0.6;if(e.stag>=e.max*0.35){e.stagT=1.6;e.stag=e.max*0.35;fxText(e.x,e.y-46,'경직! 빙의 가능','#5cc8ff');}}
 fxText(e.x+rnd(-10,10),e.y-20,Math.round(dmg)+'',crit?'#ffd24d':'#fff');
 if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
 if(e.dead)return;e.dead=true;S.kills++;S.xp+=e.ty==='boss'?0:(e.ty==='brute'||e.ty==='host')?16:8;
 S.fx.push({ty:'ring',x:e.x,y:e.y,r:e.r+20,c:'#fff',life:0.3});
 const me=passiveMul('medium');if(me&&Math.random()<0.3*me)S.allies.push({ty:'skel',x:e.x,y:e.y,life:4,t:0});
 const sl=passiveMul('baseball');if(sl&&Math.random()<0.2*sl){for(const x of S.ents)if(!x.dead&&x!==e&&dist(x,e)<150){const a=Math.atan2(x.y-e.y,x.x-e.x);x.x+=Math.cos(a)*80;x.y+=Math.sin(a)*80;hurtEnemy(x,30,{});}S.fx.push({ty:'ring',x:e.x,y:e.y,r:150,c:'#f2c14e',life:0.35});}

function nearestEnemy(p,maxD,not){let b=null,bd=maxD||1e9;for(const e of S.ents){if(e.dead||e===not)continue;const d=dist(e,p);if(d<bd){bd=d;b=e;}}return b;}

 d*=m;if(S.shield>0){const a=Math.min(S.shield,d);S.shield-=a;d-=a;}

  case 'commando_grenade':if(tgt){for(let j=0;j<8;j++){const a=j/8*Math.PI*2;const x=tgt.x+Math.cos(a)*120,y=tgt.y+Math.sin(a)*120;setTimeout(()=>{if(!S)return;aoe(x,y,75,atk*1.4,{at:h.at});S.fx.push({ty:'ring',x,y,r:75,c:'#ffb84d',life:0.35});},j*60);}}say();break;
  case 'salamander':for(const e of S.ents)if(!e.dead&&dist(e,caster)<320){e.poison=4*p;e.slow=Math.max(e.slow,2);hurtEnemy(e,atk*0.6,{aoe:true,at:h.at});}S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:320,c:'#73ff8c',life:0.45});say();break;

  case 'dragon_blue':for(let j=0;j<8;j++)setTimeout(()=>{if(!S)return;const live=S.ents.filter(e=>!e.dead);if(!live.length)return;const e=live[Math.floor(Math.random()*live.length)];hurtEnemy(e,atk*1.5,{aoe:true,at:h.at});S.fx.push({ty:'bolt',x:e.x,y:TOP,x2:e.x,y2:e.y,life:0.2});},j*250);say();break;
  case 'guru':S.guardT=3*p;say('#f2c14e');break;

 }

function shoot(from,a,dmg,o){S.shots.push(Object.assign({x:from.x,y:from.y,vx:Math.cos(a)*1100,vy:Math.sin(a)*1100,dmg,life:0.9,at:from.k?HOSTS[from.k].at:null,src:o.src||'me',pierce:o.pierce?3:0,hit:new Set(),grenade:o.grenade},o));}
function basicAttack(b,mul,src){
 const h=HOSTS[b.k],t=nearestEnemy(b,h.kind==='melee'?140:h.kind==='nova'?170:700);if(!t)return false;
 const atk=b.atk*mul*(src==='me'?(S.atkMul||1):(S.handMul||1)),a=Math.atan2(t.y-b.y,t.x-b.x);b.face=a;
 const multi=src==='me'?(S.multi||0):0;
 if(h.kind==='melee'){aoe(b.x+Math.cos(a)*60,b.y+Math.sin(a)*60,80,atk*1.1,{at:h.at,src});S.fx.push({ty:'slash',x:b.x+Math.cos(a)*60,y:b.y+Math.sin(a)*60,a,life:0.15});}
 else if(h.kind==='nova'){aoe(b.x,b.y,150,atk*0.9,{at:h.at,src});S.fx.push({ty:'ring',x:b.x,y:b.y,r:150,c:BRCOL[h.br],life:0.2});}
 else if(h.kind==='spread'){for(let j=-1-multi*0.5;j<=1+multi*0.5;j++)shoot(b,a+j*0.2,atk*0.5,{src});}
 else if(h.kind==='grenade'){for(let j=0;j<=multi;j++)shoot(b,a+j*0.15,atk*0.9,{src,grenade:true});}
 else if(h.kind==='rapid'){for(let j=0;j<=multi;j++)shoot(b,a+(j-multi/2)*0.12,atk*0.38,{src});}
 else{for(let j=0;j<=multi;j++)shoot(b,a+(j-multi/2)*0.12,atk*(h.kind==='pierce'?0.9:1),{src,pierce:h.kind==='pierce'});}
 return true;
}
const RATE={single:0.45,rapid:0.15,spread:0.55,grenade:0.6,pierce:0.6,melee:0.4,nova:0.7};
function collideObst(o,r){for(const b of S.obst){const nx=clamp(o.x,b.x,b.x+b.w),ny=clamp(o.y,b.y,b.y+b.h);const dx=o.x-nx,dy=o.y-ny,d=Math.hypot(dx,dy);if(d<r&&d>0){o.x=nx+dx/d*r;o.y=ny+dy/d*r;}else if(d===0){o.y=b.y-r;}}}
function inObst(x,y){return S.obst.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);}
// 장애물을 돌아서 쫓는다 — 막히면 한쪽으로 비켜 간다
function steer(e,tx,ty,sp,dt){const base=Math.atan2(ty-e.y,tx-e.x);e.side=e.side||(Math.random()<0.5?1:-1);const r=e.r+4,look=e.r+18;
 for(const o of [0,0.7,1.4,2.1,-0.7,-1.4]){const a=base+o*e.side;const lx=e.x+Math.cos(a)*look,ly=e.y+Math.sin(a)*look;if(!S.obst.some(b=>lx>b.x-r&&lx<b.x+b.w+r&&ly>b.y-r&&ly<b.y+b.h+r)){e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;return a;}}
 e.side=-e.side;return base;}
function update(dt){
 if(modal||scene!=='play')return;
 if(S.pendingLv>0&&S.cleared){openLevelUp();return;}
 S.t+=dt;SYN=synergies();
 const me=S.body||S.ghost;
 // 이동
 let mx=0,my=0;if(S.joy){mx=S.joy.dx;my=S.joy.dy;}
 if(S.keys.a||S.keys.arrowleft)mx-=1;if(S.keys.d||S.keys.arrowright)mx+=1;if(S.keys.w||S.keys.arrowup)my-=1;if(S.keys.s||S.keys.arrowdown)my+=1;
 const ml=Math.hypot(mx,my);const moving=ml>0.15;
 const spd=S.body?HOSTS[S.body.k].spd*(1+0.2*Math.min(1.5,passiveMul('amazon'))):380;
 if(moving){me.x+=mx/Math.max(1,ml)*spd*dt;me.y+=my/Math.max(1,ml)*spd*dt;S.stopT=0;}else S.stopT+=dt;
 me.x=clamp(me.x,30,W-30);me.y=clamp(me.y,TOP+20,BOT-20);
 if(S.body&&!passiveMul('guru'))collideObst(me,24);
 // 타이머
 S.invuln-=dt;S.swapCd-=dt;S.shieldT-=dt;if(S.shieldT<=0)S.shield=0;S.guardT-=dt;S.reflectT-=dt;S.flash=Math.max(0,(S.flash||0)-dt);S.hurtFlash=Math.max(0,(S.hurtFlash||0)-dt);
 if(S.orbs<S.orbMax){S.orbT+=dt;if(S.orbT>=S.orbRate){S.orbT=0;S.orbs++;}}else S.orbT=0;
 if(S.body){S.body.actCd=Math.max(0,S.body.actCd-dt);
  // 멈춰야 쏜다(궁수의 전설 규칙)
  S.atkT-=dt;if(!moving&&S.stopT>0.03&&S.atkT<=0){if(basicAttack(S.body,1,'me'))S.atkT=RATE[HOSTS[S.body.k].kind]*(S.rateMul||1);}}

 const R=ROOMS[S.room];txt('잔혼 파티 시험판 · '+(S.room+1)+' / 15방 · '+({start:'시작',battle:'전투',doctor:'박사의 통신',leader:'결사 간부',boss:'아지트 두목'}[R.t]),16,24,20,'#cfd');
 txt('Lv '+S.lv,W-16,24,20,'#f2c14e','right');bar(W-180,40,164,6,S.xp/(30*S.lv),'#f2c14e');
 // 유령 에너지 막대 — 나눠 쓴 몫이 보이게
 const X=16,Y=52,BW=W-32,BH=26,full=S.maxBase;txt('유령 에너지 '+Math.round(S.energy)+' / '+Math.round(energyMax()),X,Y-4+BH+18,18,'#7fe3ff');
 cx.fillStyle='#222';cx.fillRect(X,Y,BW,BH);const u=BW/full;cx.fillStyle='#5cc8ff';cx.fillRect(X,Y,S.energy*u,BH);
 let x=X+energyMax()*u;const seg=(w,c,l)=>{cx.fillStyle=c;cx.fillRect(x,Y,w*u,BH);cx.strokeStyle='#111';cx.strokeRect(x,Y,w*u,BH);if(w*u>40)txt(l,x+w*u/2,Y+BH/2,13,'#111','center');x+=w*u;};
 if(S.soul)seg(share('soul'),'#73ff8c','혼');S.hand.forEach(()=>seg(share('hand'),'#9fe7ff','손'));if(S.spirit)seg(share('spirit'),'#c9a8ff','혼백');if(S.lost)seg(S.lost,'#552','잃음');
 // 시너지
 let sx=16;SYN.forEach(s=>{const w=cx.measureText(s.n).width;rr(sx,112,w+38,28,8,'#2b2240','#b98cff',2);txt(s.n,sx+12,126,16,'#e3d4ff');sx+=w+48;});
 if(!SYN.length)txt('시너지 없음 — 같은 갈래 둘 · 이름 있는 짝 · 파워 · 무기 · 마법 하나씩',16,126,15,'#667');
}
function drawPanel(){
 cx.fillStyle='#14141d';cx.fillRect(0,PANEL_Y,W,H-PANEL_Y);
 // 자리 셋
 const slots=[['soul',S.soul],['hand',S.hand],['spirit',S.spirit]];
 let x=10;const y=PANEL_Y+10;
 const card=(slot,m,label,i)=>{const fit=m&&FIT[HOSTS[m.k].br]===slot;const w=slot==='hand'?118:124;
  btn(x,y,w,130,'',()=>{if(slot==='hand'&&m)swapInto(i);},{bg:'#1e1e2a',stroke:m?(fit?'#f2c14e':BRCOL[HOSTS[m.k].br]):'#333',lw:fit?4:2,hold:m?()=>releaseSlot(slot,i):null});
  txt(label,x+w/2,y+14,14,{soul:'#73ff8c',hand:'#9fe7ff',spirit:'#c9a8ff'}[slot],'center');
  if(m){spr(hostSpr(m.k),x+w/2,y+64,64,slot==='hand'?1:0.75);txt(HOSTS[m.k].n,x+w/2,y+106,14,'#fff','center');
   txt(slot==='soul'?HOSTS[m.k].pas[0]:slot==='hand'?HOSTS[m.k].act[0]:HOSTS[m.k].ult,x+w/2,y+122,12,'#aab','center');
   if(slot==='hand'){bar(x+8,y+28,w-16,4,m.hp/m.max,'#7fe3ff');}}
  else txt('비어 있음',x+w/2,y+68,14,'#555','center');x+=w+6;};
 card('soul',S.soul,'혼 · 패시브',0);
 for(let i=0;i<S.handCap;i++)card('hand',S.hand[i],'손 · 액티브',i);
 card('spirit',S.spirit,'혼백 · 필살기',0);
 // 구슬
 for(let i=0;i<S.orbMax;i++){cx.fillStyle=i<S.orbs?'#f2c14e':'#3a3420';cx.beginPath();cx.arc(24+i*26,PANEL_Y+160,9,0,7);cx.fill();}
 txt('혼 이동 구슬(옮겨 타기) · 손 칸 누르기 = 옮겨 타기 · 칸 길게 = 놓아주기',24+S.orbMax*26,PANEL_Y+160,14,'#998');
 // 버튼
 const bx=W-250,by=PANEL_Y+184;
 if(S.body){const h=HOSTS[S.body.k];const cd=S.body.actCd;
  btn(bx,by,120,76,'',useActive,{bg:cd>0?'#222':'#24405a',stroke:BRCOL[h.br]});txt('액티브',bx+60,by+22,16,'#9cf','center');txt(cd>0?cd.toFixed(1):h.act[0],bx+60,by+50,cd>0?24:16,'#fff','center');
  btn(bx+126,by,120,76,'',useUlt,{bg:S.ultReady?'#4a2a60':'#222',stroke:S.ultReady?'#c9a8ff':'#444'});txt('필살기',bx+186,by+22,16,'#d9c2ff','center');txt(S.ultReady?h.ult:'빙의 · 옮겨 타기로 참',bx+186,by+50,S.ultReady?16:12,'#fff','center');}
 const tg=possessTarget();
 btn(bx-130,by,124,76,'',doPossess,{bg:tg?'#1d4a66':'#1a1a22',stroke:tg?'#5cc8ff':'#333',lw:tg?4:2});txt('빙의',bx-68,by+24,20,tg?'#bff':'#556','center');txt(tg?HOSTS[tg.k].n:(S.body?'경직된 호스트 필요':'가까운 호스트'),bx-68,by+52,13,tg?'#fff':'#556','center');
 // 조이스틱
 if(S.joy){cx.strokeStyle='rgba(255,255,255,.25)';cx.lineWidth=3;cx.beginPath();cx.arc(S.joy.ox,S.joy.oy,70,0,7);cx.stroke();cx.fillStyle='rgba(255,255,255,.25)';cx.beginPath();cx.arc(S.joy.ox+S.joy.dx*60,S.joy.oy+S.joy.dy*60,30,0,7);cx.fill();}
 txt('방 안 아무 데나 끌어서 이동 · 멈추면 자동 공격',16,H-24,14,'#667');
 btn(16,by+8,90,56,'규칙',()=>openHelp(),{sz:18});
 // 알림
 toastList.slice(-3).forEach((t,i)=>{cx.globalAlpha=clamp(t.life,0,1)*0.9;rr(90,TOP+6+i*30,W-180,26,8,'rgba(10,10,20,.75)',null);txt(t.t,W/2,TOP+19+i*30,14,t.c,'center');cx.globalAlpha=1;});
}
function openHelp(){modal={title:'규칙 한 장',lines:[
 '· 나는 유령. 적 호스트를 경직(체력 35% 몰아치기)시켜 「빙의」로 빼앗는다. 유령일 땐 가까운 호스트에 바로 빙의.',
 '· 빼앗으면 떠난 몸을 세 자리 중 하나에 남긴다(잔혼). 혼 = 패시브가 내 몸에 · 손 = 따라다니며 액티브 · 혼백 = 내 필살기 뒤 그 몸 필살기.',
 '· 맞는 자리(금빛 ★)에 두면 효과 ×1.5. 수호 · 제압 → 혼 / 소환 · 설치 → 손 / 단일 · 탄막 · 돌격 → 혼백.',
 '· 잔혼마다 유령 에너지 최대치를 나눠 쓴다(혼 10 · 손 15 · 혼백 20). 몸이 쓰러지면 −20. 0 이면 패배.',
 '· 손 자리 칸을 누르면 그 몸으로 옮겨 탄다(구슬 1개, 6초마다 참). 옮겨 탄 몸은 이 방에서 필살기가 한 번 다시 찬다.',
 '· 칸을 길게 누르면 놓아주기 — 혼불 폭발 후 몸이 쓰러진다. 에너지 몫이 돌아온다.',
 '· 적 유형: 떼(제압 · 탄막) · 방패(정면 탄 막음 → 돌격 · 폭발) · 탄막(수호 · 반사) · 날쌘(빨간 선 뒤 돌진 → 설치 · 소환) · 거대(단일 강타).',
 '· 속성 파워 → 무기 → 마법 → 파워 ±30%. 문 위에 다음 방 적 유형이 미리 뜬다.'],opts:[{t:'닫기',fn:()=>{}}]};}
function drawModal(){
 if(!modal)return;cx.fillStyle='rgba(0,0,0,.72)';cx.fillRect(0,0,W,H);
 const lines=modal.lines||[];let h=120+lines.length*34+modal.opts.length*104;const y0=Math.max(40,(H-h)/2);
 rr(24,y0,W-48,h,18,'#1b1b27','#5cc8ff',2);txt(modal.title,W/2,y0+40,26,'#fff','center');
 cx.font='16px "Malgun Gothic"';lines.forEach((l,i)=>wrap(l,48,y0+84+i*34,W-96,16,'#c8c8d8'));
 let y=y0+84+lines.length*34+10;
 modal.opts.forEach(o=>{const dis=o.disabled;btn(44,y,W-88,92,'',()=>{if(dis)return;const m=modal;modal=null;o.fn();if(modal===m)modal=null;},{bg:dis?'#151515':o.gold?'#3a3016':'#252533',stroke:dis?'#333':o.gold?'#f2c14e':'#4a4a60',lw:o.gold?3:2});
  txt(o.t,64,y+26,21,dis?'#555':o.gold?'#ffd56a':'#fff');wrap(o.sub||'',64,y+56,W-140,14,dis?'#444':'#aab');y+=104;});
}
function wrap(t,x,y,w,sz,c){cx.font='500 '+sz+'px "Pretendard","Malgun Gothic",sans-serif';let line='',yy=y;for(const ch of t){const tl=line+ch;if(cx.measureText(tl).width>w){txt(line,x,yy,sz,c,'left','500');line=ch;yy+=sz+5;}else line=tl;}txt(line,x,yy,sz,c,'left','500');}
function drawLobby(){
 cx.fillStyle='#101018';cx.fillRect(0,0,W,H);
 txt('잔혼 파티 — 시험판',W/2,90,40,'#fff','center');txt('한 영혼, 여러 몸 · 게임 방향 1번 안(2026-10-28)',W/2,138,20,'#9ab','center');
 spr('ghost',W/2,250,150);
 txt('영혼 핵 '+acct.core+' · 판 '+acct.runs+' · 최고 '+acct.best+'방',W/2,350,22,'#7fe3ff','center');
 txt('박사의 연구(영혼 핵)',40,404,22,'#f2c14e');
 RESEARCH.forEach((r,i)=>{const y=424+i*66,own=hasRes(r.id),can=!own&&acct.core>=r.cost;
  btn(40,y,W-80,58,'',()=>{if(can){acct.core-=r.cost;acct.res[r.id]=1;saveAcct();}},{bg:own?'#1c3322':'#1e1e2a',stroke:own?'#73ff8c':can?'#f2c14e':'#333'});
  txt(r.n,60,y+20,18,own?'#9f9':'#fff');txt(r.d,60,y+42,14,'#99a');txt(own?'연구 완료':r.cost+' 핵',W-60,y+29,18,own?'#9f9':can?'#f2c14e':'#666','right');});
 txt('호스트 기록(조각 → 성급) · ★3 이상은 「동행」으로 고를 수 있다',40,770,18,'#f2c14e');
 HOSTKEYS.forEach((k,i)=>{const cxp=40+(i%7)*92,cy=800+Math.floor(i/7)*120,st=stars(k),comp=acct.companion===k;
  btn(cxp,cy,84,112,'',()=>{if(st>=3){acct.companion=comp?null:k;saveAcct();}},{bg:'#1a1a24',stroke:comp?'#b98cff':st>=3?'#f2c14e':'#333',lw:comp?4:2});
  spr(hostSpr(k),cxp+42,cy+42,60,st?1:0.45);txt(HOSTS[k].n.replace('코만도','코만').slice(0,6),cxp+42,cy+82,12,'#ccd','center');txt('★'+st+' ('+(acct.shard[k]||0)+')',cxp+42,cy+100,12,st?'#f2c14e':'#666','center');});
 btn(W/2-160,1080,320,96,'출전 — 유령으로',()=>newRun(),{bg:'#1d4a66',stroke:'#5cc8ff',lw:4,sz:28});
 btn(W/2-160,1190,150,60,'규칙',()=>openHelp(),{sz:20});
 btn(W/2+10,1190,150,60,'기록 지우기',()=>{acct={core:3,res:{},shard:{},runs:0,best:0,companion:null};saveAcct();},{sz:18,c:'#f88'});
}
function drawResult(){
 const r=S.result;cx.fillStyle='rgba(10,10,18,.94)';cx.fillRect(0,0,W,H);
 txt(r.win?'아지트 해방!':'유령 에너지가 다했다',W/2,260,40,r.win?'#73ff8c':'#ff5c4d','center');
 txt('도달 '+r.rooms+'방 · 처치 '+r.kills+' · 판 레벨 '+r.lv,W/2,340,24,'#fff','center');
 txt('영혼 핵 +'+r.core,W/2,400,26,'#7fe3ff','center');
 txt('조각(빼앗은 몸 × 2): '+(r.gained.join(' · ')||'없음'),W/2,460,18,'#f2c14e','center');
 btn(W/2-150,560,300,90,'로비로',()=>{scene='lobby';S=null;},{sz:26,bg:'#1d4a66',stroke:'#5cc8ff'});
}
function frame(){
 UI=[];cx.clearRect(0,0,W,H);
 if(scene==='lobby')drawLobby();
 else{drawRoom();drawEnts();drawHud();drawPanel();if(scene==='result')drawResult();}
 drawModal();
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(scene==='play'){try{update(dt);}catch(err){console.error(err);}}frame();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ─────────────────────────────────────────
// 입력
// ─────────────────────────────────────────
function pt(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
const downs={};
cv.addEventListener('pointerdown',ev=>{const p=pt(ev);cv.setPointerCapture(ev.pointerId);
 const hits=UI.filter(u=>p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h);const u=hits[hits.length-1];
 if(modal){if(u){downs[ev.pointerId]={u,t:performance.now()};}return;}
 if(u){downs[ev.pointerId]={u,t:performance.now()};if(u.hold)u.timer=setTimeout(()=>{u.held=true;u.hold();},550);return;}
 if(scene==='play'&&p.y>TOP&&p.y<PANEL_Y&&!S.joy){S.joy={id:ev.pointerId,ox:p.x,oy:p.y,dx:0,dy:0};}
});
cv.addEventListener('pointermove',ev=>{if(S&&S.joy&&S.joy.id===ev.pointerId){const p=pt(ev);let dx=(p.x-S.joy.ox)/60,dy=(p.y-S.joy.oy)/60;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}S.joy.dx=dx;S.joy.dy=dy;}});
function up(ev){const d=downs[ev.pointerId];delete downs[ev.pointerId];
 if(d){clearTimeout(d.u.timer);const p=pt(ev);const inside=p.x>=d.u.x&&p.x<=d.u.x+d.u.w&&p.y>=d.u.y&&p.y<=d.u.y+d.u.h;if(!d.u.held&&inside&&d.u.fn)d.u.fn();d.u.held=false;}
 if(S&&S.joy&&S.joy.id===ev.pointerId)S.joy=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(S)S.keys[k]=true;if(!S||scene!=='play'||modal)return;
 if(k==='j')useActive();if(k==='k')useUlt();if(k==='l'||k===' ')doPossess();if(k==='1')swapInto(0);if(k==='2')swapInto(1);});
addEventListener('keyup',ev=>{if(S)S.keys[ev.key.toLowerCase()]=false;});
window.__T={step:(dt)=>{update(dt);},get S(){return S},newRun,doPossess,swapInto,useActive,useUlt,enterRoom,get modal(){return modal},pick:i=>{const o=modal.opts[i];modal=null;o.fn();},possessTarget};
</script>
