 const ats=new Set(ks.map(k=>HOSTS[k].at));if(ats.size===3)out.push({id:'tri',n:'삼각 진형',d:'모든 피해 +10%'});
 return out;}
let SYN=[];const syn=id=>SYN.some(s=>s.id===id);

function hurtEnemy(e,dmg,o){
 o=o||{};if(e.dead)return;
 // 방패: 정면(플레이어 쪽) 탄은 막는다 — 폭발 · 광역 · 파편탄은 통과
 if(e.ty==='shield'&&o.shot&&!o.aoe&&!(o.src==='me'&&passiveMul('commando_grenade'))){const a=Math.atan2(o.from.y-e.y,o.from.x-e.x);const d=Math.abs(((a-e.face)+Math.PI*3)%(Math.PI*2)-Math.PI);if(d<1.0){fxText(e.x,e.y-30,'막힘','#aaa');return;}}
 let m=1;
 if(o.at){if(BEATS[o.at]===e.at)m*=1.3;else if(BEATS[e.at]===o.at)m*=0.7;}
 if(e.mark>0)m*=1.3;if(e.root>0)m*=1.3;
 if(e.poison>0&&passiveMul('salamander'))m*=1.25;
 if(e.freeze>0){m*=1.3;if(syn('shatter'))m*=1.3;}
 if(syn('tri'))m*=1.1;
 if(o.src==='me'&&passiveMul('thug')){let n=0;for(const x of S.ents)if(!x.dead&&dist(x,S.body)<300)n++;if(n>=3)m*=1.15;}
 let crit=Math.random()<0.08;if(crit)m*=2;
 dmg*=m;
 if(o.src==='me'){ // 몸 · 혼 자리 패시브
  const g=passiveMul('gangster');if(g&&e.mark>0&&Math.random()<0.2*g){if(e.ty==='boss')dmg+=e.max*0.04;else{dmg=e.hp+1;fxText(e.x,e.y-40,'처형','#ff5c4d');}}
  const sa=passiveMul('salamander');if(sa&&Math.random()<0.1*sa)e.poison=3;
  const dr=passiveMul('dragoon');if(dr&&Math.random()<0.1*dr)e.burn=3;
  const sn=passiveMul('snowwoman');if(sn&&Math.random()<0.3*sn&&e.ty!=='boss')e.freeze=1.6;
  const db=passiveMul('dragon_blue');if(db&&Math.random()<0.1*db){const t=nearestEnemy(e,250,e);if(t){hurtEnemy(t,dmg*0.5,{at:'magic'});S.fx.push({ty:'bolt',x:e.x,y:e.y,x2:t.x,y2:t.y,life:0.25});}}
  const rb=passiveMul('robot');if(rb&&Math.random()<0.02*rb&&S.body)S.body.actCd=Math.max(0,S.body.actCd-1);
 }
 if(syn('inferno')&&e.burn>0&&e.poison>0&&!e.boomed){e.boomed=true;aoe(e.x,e.y,110,60,{});S.fx.push({ty:'ring',x:e.x,y:e.y,r:110,c:'#9f6',life:0.4});}
 e.hp-=dmg;e.hitT=0.1;
 if(e.ty==='host'&&e.stagLock<=0&&e.stagT<=0){e.stag+=dmg;e.stagHit=0.6;if(e.stag>=e.max*0.35){e.stagT=1.6;e.stag=e.max*0.35;fxText(e.x,e.y-46,'경직! 빙의 가능','#5cc8ff');}}
 fxText(e.x+rnd(-10,10),e.y-20,Math.round(dmg)+'',crit?'#ffd24d':'#fff');
 if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
 if(e.dead)return;e.dead=true;S.kills++;S.xp+=e.ty==='boss'?0:(e.ty==='brute'||e.ty==='host')?16:8;
 S.fx.push({ty:'ring',x:e.x,y:e.y,r:e.r+20,c:'#fff',life:0.3});
 const me=passiveMul('medium');if(me&&Math.random()<0.3*me)S.allies.push({ty:'skel',x:e.x,y:e.y,life:4,t:0});
 const sl=passiveMul('baseball');if(sl&&Math.random()<0.2*sl){for(const x of S.ents)if(!x.dead&&x!==e&&dist(x,e)<150){const a=Math.atan2(x.y-e.y,x.x-e.x);x.x+=Math.cos(a)*80;x.y+=Math.sin(a)*80;hurtEnemy(x,30,{});}S.fx.push({ty:'ring',x:e.x,y:e.y,r:150,c:'#f2c14e',life:0.35});}
 if(S.body)S.orbT+=0.5;
 while(S.xp>=30*S.lv){S.xp-=30*S.lv;S.lv++;S.pendingLv++;}
 if(e.ty==='boss'){S.won=true;setTimeout(()=>endRun(true),900);}
}
function aoe(x,y,r,dmg,o){for(const e of S.ents)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r)hurtEnemy(e,dmg,Object.assign({aoe:true},o));}
function nearestEnemy(p,maxD,not){let b=null,bd=maxD||1e9;for(const e of S.ents){if(e.dead||e===not)continue;const d=dist(e,p);if(d<bd){bd=d;b=e;}}return b;}
function fxText(x,y,t,c){S.fx.push({ty:'txt',x,y,t,c,life:0.8});}
function hurtMe(d,from){
 if(!S.body||S.invuln>0)return;
 let m=1;if(passiveMul('commando_mg'))m*=1-0.2*Math.min(1.5,passiveMul('commando_mg'));if(syn('wall'))m*=0.85;if(S.guardT>0)m*=0.5;
 if(from&&from.at){if(BEATS[from.at]===S.body.at)m*=1.3;else if(BEATS[HOSTS[S.body.k].at]===from.at)m*=0.7;}
 const nc=passiveMul('ninja_chain');if(nc&&Math.random()<0.1*nc){fxText(S.body.x,S.body.y-40,'흘림','#ccc');return;}
 d*=m;if(S.shield>0){const a=Math.min(S.shield,d);S.shield-=a;d-=a;}
 S.body.hp-=d;S.hurtFlash=0.15;
 if(S.body.hp<=0)bodyDies();
}
function bodyDies(){

 if(S.hand.length){let bi=0,bd=1e9;S.hand.forEach((m,i)=>{const d=Math.hypot(m.x-b.x,m.y-b.y);if(d<bd){bd=d;bi=i;}});const m=S.hand.splice(bi,1)[0];S.body=m;S.invuln=1;toast('가까운 잔혼 '+HOSTS[m.k].n+' (으)로 자동 옮겨 탐','#5cc8ff');S.fx.push({ty:'beam',x:b.x,y:b.y,x2:m.x,y2:m.y,life:0.35});}
 else{S.ghost.x=b.x;S.ghost.y=b.y;S.rescueT=3;toast('유령 상태 — 가까운 호스트에 빙의하라','#5cc8ff');}

function castActive(k,caster,p,echo){
 const h=HOSTS[k],atk=(caster.atk||h.atk)*p,me=S.body||caster;
 const tgt=nearestEnemy(caster,900);
 const say=(c)=>{if(!echo)fxText(caster.x,caster.y-56,h.act[0],c||BRCOL[h.br]);};
 switch(k){
  case 'gangster':for(const e of S.ents)if(!e.dead)e.mark=3*p;say();break;
  case 'thug':if(tgt){const a0=Math.atan2(tgt.y-caster.y,tgt.x-caster.x);for(let w=0;w<3;w++)setTimeout(()=>{if(!S)return;for(let j=-2;j<=2;j++)shoot(caster,a0+j*0.22,atk*0.6,{});},w*180);}say();break;
  case 'amazon':if(tgt){S.fx.push({ty:'beam',x:caster.x,y:caster.y,x2:tgt.x,y2:tgt.y+30,life:0.25});caster.x=tgt.x;caster.y=tgt.y+tgt.r+20;aoe(caster.x,caster.y,120,atk*3,{at:h.at});S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:120,c:'#ff9a3c',life:0.4});}say();break;
  case 'commando_mg':if(S.body){S.shield=Math.max(S.shield,S.body.max*0.5*p);S.shieldT=5;}say();break;
  case 'commando_grenade':if(tgt){for(let j=0;j<8;j++){const a=j/8*Math.PI*2;const x=tgt.x+Math.cos(a)*120,y=tgt.y+Math.sin(a)*120;setTimeout(()=>{if(!S)return;aoe(x,y,75,atk*1.4,{at:h.at});S.fx.push({ty:'ring',x,y,r:75,c:'#ffb84d',life:0.35});},j*60);}}say();break;
  case 'salamander':for(const e of S.ents)if(!e.dead&&dist(e,caster)<320){e.poison=4*p;e.slow=Math.max(e.slow,2);hurtEnemy(e,atk*0.6,{aoe:true,at:h.at});}S.fx.push({ty:'ring',x:caster.x,y:caster.y,r:320,c:'#73ff8c',life:0.45});say();break;
  case 'dragoon':if(tgt)S.zones.push({x:tgt.x,y:tgt.y,r:115*Math.sqrt(p),life:4,dps:atk*1.1,c:'rgba(255,120,40,.35)',burn:true});say();break;
  case 'dragon_blue':for(let j=0;j<8;j++)setTimeout(()=>{if(!S)return;const live=S.ents.filter(e=>!e.dead);if(!live.length)return;const e=live[Math.floor(Math.random()*live.length)];hurtEnemy(e,atk*1.5,{aoe:true,at:h.at});S.fx.push({ty:'bolt',x:e.x,y:TOP,x2:e.x,y2:e.y,life:0.2});},j*250);say();break;
  case 'guru':S.guardT=3*p;say('#f2c14e');break;
  case 'medium':for(let j=0;j<Math.round(2*p);j++)S.allies.push({ty:'skel',x:caster.x+rnd(-40,40),y:caster.y-30,life:8,t:0});say();break;
  case 'ninja_chain':for(const e of S.ents)if(!e.dead&&e.ty!=='boss'){e.root=3*p;S.fx.push({ty:'beam',x:caster.x,y:caster.y,x2:e.x,y2:e.y,life:0.3,c:'#b98cff'});}say();break;
  case 'baseball':S.reflectT=5*p;say();break;
  case 'snowwoman':if(S.body){S.invuln=Math.max(S.invuln,1);S.body.hp=Math.min(S.body.max,S.body.hp+S.body.max*0.3*p);}S.fx.push({ty:'ring',x:me.x,y:me.y,r:90,c:'#bfe9ff',life:0.5});say();break;
  case 'robot':S.allies.push({ty:'turret',x:caster.x+30,y:caster.y-40,life:10*p,t:0,atk:atk*0.5});say();break;
 }
}
function useActive(){
 if(!S.body||S.body.actCd>0)return;
 const k=S.body.k,h=HOSTS[k];castActive(k,S.body,1);S.body.actCd=h.act[1];
 // 공명: 파티에 같은 갈래가 있으면 40% 로 한 번 더
 const same=[S.soul,...S.hand,S.spirit].filter(m=>m&&HOSTS[m.k].br===h.br).length;
 if(same>0)setTimeout(()=>{if(S&&S.body){castActive(k,S.body,0.4,true);fxText(S.body.x,S.body.y-76,'공명','#b98cff');}},450);
}
function castUlt(k,caster,p){
 const h=HOSTS[k];S.flash=0.35;S.cut={n:h.ult,k,life:1.1};

function shoot(from,a,dmg,o){S.shots.push(Object.assign({x:from.x,y:from.y,vx:Math.cos(a)*1100,vy:Math.sin(a)*1100,dmg,life:0.9,at:from.k?HOSTS[from.k].at:null,src:o.src||'me',pierce:o.pierce?3:0,hit:new Set(),grenade:o.grenade},o));}
function basicAttack(b,mul,src){
 const h=HOSTS[b.k],t=nearestEnemy(b,h.kind==='melee'?140:h.kind==='nova'?170:700);if(!t)return false;
 const atk=b.atk*mul*(src==='me'?(S.atkMul||1):(S.handMul||1)),a=Math.atan2(t.y-b.y,t.x-b.x);b.face=a;
 const multi=src==='me'?(S.multi||0):0;
 if(h.kind==='melee'){aoe(b.x+Math.cos(a)*60,b.y+Math.sin(a)*60,80,atk*1.1,{at:h.at,src});S.fx.push({ty:'slash',x:b.x+Math.cos(a)*60,y:b.y+Math.sin(a)*60,a,life:0.15});}
 else if(h.kind==='nova'){aoe(b.x,b.y,150,atk*0.9,{at:h.at,src});S.fx.push({ty:'ring',x:b.x,y:b.y,r:150,c:BRCOL[h.br],life:0.2});}
 else if(h.kind==='spread'){for(let j=-1-multi*0.5;j<=1+multi*0.5;j++)shoot(b,a+j*0.2,atk*0.5,{src});}
 else if(h.kind==='grenade'){for(let j=0;j<=multi;j++)shoot(b,a+j*0.15,atk*0.9,{src,grenade:true});}
 else if(h.kind==='rapid'){for(let j=0;j<=multi;j++)shoot(b,a+(j-multi/2)*0.12,atk*0.38,{src});}
 else{for(let j=0;j<=multi;j++)shoot(b,a+(j-multi/2)*0.12,atk*(h.kind==='pierce'?0.9:1),{src,pierce:h.kind==='pierce'});}
 return true;
}
const RATE={single:0.45,rapid:0.15,spread:0.55,grenade:0.6,pierce:0.6,melee:0.4,nova:0.7};
function collideObst(o,r){for(const b of S.obst){const nx=clamp(o.x,b.x,b.x+b.w),ny=clamp(o.y,b.y,b.y+b.h);const dx=o.x-nx,dy=o.y-ny,d=Math.hypot(dx,dy);if(d<r&&d>0){o.x=nx+dx/d*r;o.y=ny+dy/d*r;}else if(d===0){o.y=b.y-r;}}}
function inObst(x,y){return S.obst.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);}
// 장애물을 돌아서 쫓는다 — 막히면 한쪽으로 비켜 간다
function steer(e,tx,ty,sp,dt){const base=Math.atan2(ty-e.y,tx-e.x);e.side=e.side||(Math.random()<0.5?1:-1);const r=e.r+4,look=e.r+18;
 for(const o of [0,0.7,1.4,2.1,-0.7,-1.4]){const a=base+o*e.side;const lx=e.x+Math.cos(a)*look,ly=e.y+Math.sin(a)*look;if(!S.obst.some(b=>lx>b.x-r&&lx<b.x+b.w+r&&ly>b.y-r&&ly<b.y+b.h+r)){e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;return a;}}
 e.side=-e.side;return base;}
function update(dt){
 if(modal||scene!=='play')return;
 if(S.pendingLv>0&&S.cleared){openLevelUp();return;}
 S.t+=dt;SYN=synergies();

 const ml=Math.hypot(mx,my);const moving=ml>0.15;

 if(moving){me.x+=mx/Math.max(1,ml)*spd*dt;me.y+=my/Math.max(1,ml)*spd*dt;S.stopT=0;}else S.stopT+=dt;
 me.x=clamp(me.x,30,W-30);me.y=clamp(me.y,TOP+20,BOT-20);

 // 타이머

 if(S.orbs<S.orbMax){S.orbT+=dt;if(S.orbT>=S.orbRate){S.orbT=0;S.orbs++;}}else S.orbT=0;
 if(S.body){S.body.actCd=Math.max(0,S.body.actCd-dt);
  // 멈춰야 쏜다(궁수의 전설 규칙)
  S.atkT-=dt;if(!moving&&S.stopT>0.03&&S.atkT<=0){if(basicAttack(S.body,1,'me'))S.atkT=RATE[HOSTS[S.body.k].kind]*(S.rateMul||1);}}
 // 손 자리 잔혼 — 따라다니며 약한 평타 · 쿨마다 액티브
 S.hand.forEach((m,i)=>{const tx=me.x+(i?-64:64),ty=me.y+40;m.x+=(tx-m.x)*Math.min(1,dt*4);m.y+=(ty-m.y)*Math.min(1,dt*4);

  m.actCd-=dt;if(m.actCd<=0&&S.body&&nearestEnemy(m,800)){const fit=FIT[HOSTS[m.k].br]==='hand';castActive(m.k,m,(fit?1+S.fitBonus:1)*0.8*(S.handMul||1));m.actCd=HOSTS[m.k].act[1]*1.2;}});
 // 구조 호스트
 if(!S.body&&!S.cleared&&ROOMS[S.room].t!=='boss'&&!S.ents.some(e=>!e.dead&&e.ty==='host')){S.rescueT-=dt;if(S.rescueT<=0){addHost(HOSTKEYS[Math.floor(Math.random()*HOSTKEYS.length)],W/2,TOP+80,0.6);toast('구조 호스트가 들어왔다','#5cc8ff');S.rescueT=20;}}

 // 적

  const tgt=S.body||null;const sp=(e.spd||0)*(e.freeze>0?0.45:1)*(e.slow>0?0.6:1)*(e.root>0?0:1);

   if(e.stagT>0){e.stagT-=dt;if(e.stagT<=0)e.stagLock=2;continue;}

   if(S.stagNeed&&e.stag>=e.max*S.stagNeed&&e.stagLock<=0){e.stagT=1.6;fxText(e.x,e.y-46,'경직! 빙의 가능','#5cc8ff');}
   if(tgt){const d=dist(e,tgt);if(d>260)steer(e,tgt.x,tgt.y,sp,dt);
    if(e.t<=0){e.t=1.4;const a=Math.atan2(tgt.y-e.y,tgt.x-e.x);eshoot(e,a,e.dmg,300);}}

  e.x=clamp(e.x,30,W-30);e.y=clamp(e.y,TOP+20,BOT-20);if(e.ty!=='boss'&&e.ty!=='dasher'&&e.ty!=='swarm')collideObst(e,e.r);

 }
 // 적끼리 밀기
 for(let i=0;i<S.ents.length;i++)for(let j=i+1;j<S.ents.length;j++){const a=S.ents[i],b=S.ents[j];if(a.dead||b.dead)continue;const d=dist(a,b),m=a.r+b.r;if(d<m&&d>0){const p=(m-d)/2,ux=(a.x-b.x)/d,uy=(a.y-b.y)/d;if(a.ty!=='turret'&&a.ty!=='boss'){a.x+=ux*p;a.y+=uy*p;}if(b.ty!=='turret'&&b.ty!=='boss'){b.x-=ux*p;b.y-=uy*p;}}}

 S.eshots=S.eshots.filter(s=>s.life>0&&s.y>TOP-20&&s.y<BOT+20&&s.x>-20&&s.x<W+20);
 // 장판 · 아군
 for(const z of S.zones){z.life-=dt;z.tick=(z.tick||0)-dt;if(z.tick<=0){z.tick=0.4;for(const e of S.ents)if(!e.dead&&Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r){hurtEnemy(e,z.dps*0.4,{aoe:true});if(z.burn)e.burn=2;}}}

 '· 칸을 길게 누르면 놓아주기 — 혼불 폭발 후 몸이 쓰러진다. 에너지 몫이 돌아온다.',
 '· 적 유형: 떼(제압 · 탄막) · 방패(정면 탄 막음 → 돌격 · 폭발) · 탄막(수호 · 반사) · 날쌘(빨간 선 뒤 돌진 → 설치 · 소환) · 거대(단일 강타).',
 '· 속성 파워 → 무기 → 마법 → 파워 ±30%. 문 위에 다음 방 적 유형이 미리 뜬다.'],opts:[{t:'닫기',fn:()=>{}}]};}
function drawModal(){
 if(!modal)return;cx.fillStyle='rgba(0,0,0,.72)';cx.fillRect(0,0,W,H);
 const lines=modal.lines||[];let h=120+lines.length*34+modal.opts.length*104;const y0=Math.max(40,(H-h)/2);
 rr(24,y0,W-48,h,18,'#1b1b27','#5cc8ff',2);txt(modal.title,W/2,y0+40,26,'#fff','center');
 cx.font='16px "Malgun Gothic"';lines.forEach((l,i)=>wrap(l,48,y0+84+i*34,W-96,16,'#c8c8d8'));
 let y=y0+84+lines.length*34+10;
 modal.opts.forEach(o=>{const dis=o.disabled;btn(44,y,W-88,92,'',()=>{if(dis)return;const m=modal;modal=null;o.fn();if(modal===m)modal=null;},{bg:dis?'#151515':o.gold?'#3a3016':'#252533',stroke:dis?'#333':o.gold?'#f2c14e':'#4a4a60',lw:o.gold?3:2});
  txt(o.t,64,y+26,21,dis?'#555':o.gold?'#ffd56a':'#fff');wrap(o.sub||'',64,y+56,W-140,14,dis?'#444':'#aab');y+=104;});
}
function wrap(t,x,y,w,sz,c){cx.font='500 '+sz+'px "Pretendard","Malgun Gothic",sans-serif';let line='',yy=y;for(const ch of t){const tl=line+ch;if(cx.measureText(tl).width>w){txt(line,x,yy,sz,c,'left','500');line=ch;yy+=sz+5;}else line=tl;}txt(line,x,yy,sz,c,'left','500');}
function drawLobby(){
 cx.fillStyle='#101018';cx.fillRect(0,0,W,H);
 txt('잔혼 파티 — 시험판',W/2,90,40,'#fff','center');txt('한 영혼, 여러 몸 · 게임 방향 1번 안(2026-10-28)',W/2,138,20,'#9ab','center');
 spr('ghost',W/2,250,150);
 txt('영혼 핵 '+acct.core+' · 판 '+acct.runs+' · 최고 '+acct.best+'방',W/2,350,22,'#7fe3ff','center');
 txt('박사의 연구(영혼 핵)',40,404,22,'#f2c14e');
 RESEARCH.forEach((r,i)=>{const y=424+i*66,own=hasRes(r.id),can=!own&&acct.core>=r.cost;
  btn(40,y,W-80,58,'',()=>{if(can){acct.core-=r.cost;acct.res[r.id]=1;saveAcct();}},{bg:own?'#1c3322':'#1e1e2a',stroke:own?'#73ff8c':can?'#f2c14e':'#333'});
  txt(r.n,60,y+20,18,own?'#9f9':'#fff');txt(r.d,60,y+42,14,'#99a');txt(own?'연구 완료':r.cost+' 핵',W-60,y+29,18,own?'#9f9':can?'#f2c14e':'#666','right');});
 txt('호스트 기록(조각 → 성급) · ★3 이상은 「동행」으로 고를 수 있다',40,770,18,'#f2c14e');
 HOSTKEYS.forEach((k,i)=>{const cxp=40+(i%7)*92,cy=800+Math.floor(i/7)*120,st=stars(k),comp=acct.companion===k;
  btn(cxp,cy,84,112,'',()=>{if(st>=3){acct.companion=comp?null:k;saveAcct();}},{bg:'#1a1a24',stroke:comp?'#b98cff':st>=3?'#f2c14e':'#333',lw:comp?4:2});
  spr(hostSpr(k),cxp+42,cy+42,60,st?1:0.45);txt(HOSTS[k].n.replace('코만도','코만').slice(0,6),cxp+42,cy+82,12,'#ccd','center');txt('★'+st+' ('+(acct.shard[k]||0)+')',cxp+42,cy+100,12,st?'#f2c14e':'#666','center');});
 btn(W/2-160,1080,320,96,'출전 — 유령으로',()=>newRun(),{bg:'#1d4a66',stroke:'#5cc8ff',lw:4,sz:28});
 btn(W/2-160,1190,150,60,'규칙',()=>openHelp(),{sz:20});
 btn(W/2+10,1190,150,60,'기록 지우기',()=>{acct={core:3,res:{},shard:{},runs:0,best:0,companion:null};saveAcct();},{sz:18,c:'#f88'});
}
function drawResult(){
 const r=S.result;cx.fillStyle='rgba(10,10,18,.94)';cx.fillRect(0,0,W,H);
 txt(r.win?'아지트 해방!':'유령 에너지가 다했다',W/2,260,40,r.win?'#73ff8c':'#ff5c4d','center');
 txt('도달 '+r.rooms+'방 · 처치 '+r.kills+' · 판 레벨 '+r.lv,W/2,340,24,'#fff','center');
 txt('영혼 핵 +'+r.core,W/2,400,26,'#7fe3ff','center');
 txt('조각(빼앗은 몸 × 2): '+(r.gained.join(' · ')||'없음'),W/2,460,18,'#f2c14e','center');
 btn(W/2-150,560,300,90,'로비로',()=>{scene='lobby';S=null;},{sz:26,bg:'#1d4a66',stroke:'#5cc8ff'});
}
function frame(){
 UI=[];cx.clearRect(0,0,W,H);
 if(scene==='lobby')drawLobby();
 else{drawRoom();drawEnts();drawHud();drawPanel();if(scene==='result')drawResult();}
 drawModal();
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(scene==='play'){try{update(dt);}catch(err){console.error(err);}}frame();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// ─────────────────────────────────────────
// 입력
// ─────────────────────────────────────────
function pt(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
const downs={};
cv.addEventListener('pointerdown',ev=>{const p=pt(ev);cv.setPointerCapture(ev.pointerId);
 const hits=UI.filter(u=>p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h);const u=hits[hits.length-1];
 if(modal){if(u){downs[ev.pointerId]={u,t:performance.now()};}return;}
 if(u){downs[ev.pointerId]={u,t:performance.now()};if(u.hold)u.timer=setTimeout(()=>{u.held=true;u.hold();},550);return;}
 if(scene==='play'&&p.y>TOP&&p.y<PANEL_Y&&!S.joy){S.joy={id:ev.pointerId,ox:p.x,oy:p.y,dx:0,dy:0};}
});
cv.addEventListener('pointermove',ev=>{if(S&&S.joy&&S.joy.id===ev.pointerId){const p=pt(ev);let dx=(p.x-S.joy.ox)/60,dy=(p.y-S.joy.oy)/60;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}S.joy.dx=dx;S.joy.dy=dy;}});
function up(ev){const d=downs[ev.pointerId];delete downs[ev.pointerId];
 if(d){clearTimeout(d.u.timer);const p=pt(ev);const inside=p.x>=d.u.x&&p.x<=d.u.x+d.u.w&&p.y>=d.u.y&&p.y<=d.u.y+d.u.h;if(!d.u.held&&inside&&d.u.fn)d.u.fn();d.u.held=false;}
 if(S&&S.joy&&S.joy.id===ev.pointerId)S.joy=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(S)S.keys[k]=true;if(!S||scene!=='play'||modal)return;
 if(k==='j')useActive();if(k==='k')useUlt();if(k==='l'||k===' ')doPossess();if(k==='1')swapInto(0);if(k==='2')swapInto(1);});
addEventListener('keyup',ev=>{if(S)S.keys[ev.key.toLowerCase()]=false;});
window.__T={step:(dt)=>{update(dt);},get S(){return S},newRun,doPossess,swapInto,useActive,useUlt,enterRoom,get modal(){return modal},pick:i=>{const o=modal.opts[i];modal=null;o.fn();},possessTarget};
</script>
